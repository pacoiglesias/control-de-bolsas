name: Deploy — Producción

# SECRETOS REQUERIDOS en GitHub → Settings → Secrets → Actions:
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   FIREBASE_SERVICE_ACCOUNT   ← cuenta de servicio con rol "Firebase Admin"

on:
  push:
    branches: [main]
  # Permite disparar el deploy manualmente desde la UI de GitHub Actions.
  workflow_dispatch:

# Dos deploys simultáneos al mismo proyecto pueden dejar hosting y functions
# en versiones distintas. Este bloqueo garantiza serialización.
concurrency:
  group: deploy-produccion
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Barrera de calidad (igual que ci.yml pero con secretos reales para
  #          el build, porque workflow_dispatch puede saltarse el CI pipeline).
  # ════════════════════════════════════════════════════════════════════════════
  quality:
    name: 1 · Deps · Typecheck · Tests · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Dependencias ─────────────────────────────────────────────────────────
      - name: Instalar dependencias (raíz)
        run: npm ci

      - name: Instalar dependencias (functions)
        run: npm --prefix functions ci

      # ── Typecheck ────────────────────────────────────────────────────────────
      - name: Typecheck raíz (tsc --noEmit)
        run: npm run typecheck

      - name: Typecheck functions (tsc --noEmit)
        run: npm --prefix functions run typecheck

      # ── Tests unitarios ──────────────────────────────────────────────────────
      - name: Tests (vitest run)
        run: npm test

      # ── Lint ─────────────────────────────────────────────────────────────────
      - name: Lint (ESLint)
        run: npm run lint

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build raíz (tsc -b + vite build)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Si faltó algún secreto el bundle saldrá con `apiKey:void 0`.
      # Vale más detener aquí que publicar una app muerta.
      - name: Verificar bundle lleva configuración Firebase
        run: |
          if grep -rq "apiKey:void 0" dist/assets/ 2>/dev/null; then
            echo "::error::El bundle se compiló sin las variables VITE_FIREBASE_*."
            echo "::error::Da de alta los seis secretos en Settings → Secrets → Actions."
            exit 1
          fi
          echo "✅ Configuración Firebase presente en el bundle."

      - name: Build functions (tsc)
        run: npm --prefix functions run build

      # Subir el dist/ compilado para que el job de hosting no necesite recompilar.
      - name: Subir artefacto dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Reglas de seguridad + índices (primer despliegue del orden)
  #
  # Se despliegan antes que las functions y el hosting para garantizar que
  # la base de datos esté preparada antes de que el nuevo código la use.
  # ════════════════════════════════════════════════════════════════════════════
  deploy_rules:
    name: 2 · Deploy Reglas + Índices
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Firestore rules, indexes y Storage rules
        uses: w9jds/firebase-action@v14.11.1
        with:
          args: deploy --only firestore:rules,firestore:indexes,storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: control-de-bolsas-89c88

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Cloud Functions (segundo en el orden)
  #
  # Las functions deben estar actualizadas antes de que el frontend las llame.
  # firebase.json tiene `predeploy: npm --prefix functions run build` así que
  # la Action lo compila automáticamente antes de subir.
  # ════════════════════════════════════════════════════════════════════════════
  deploy_functions:
    name: 3 · Deploy Cloud Functions
    needs: deploy_rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias (functions)
        run: npm --prefix functions ci

      - name: Deploy Cloud Functions
        uses: w9jds/firebase-action@v14.11.1
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: control-de-bolsas-89c88

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Hosting (último en el orden)
  #
  # El frontend se sirve cuando la base de datos y las functions ya están
  # en la versión nueva. Usa el dist/ producido en el job `quality`.
  # ════════════════════════════════════════════════════════════════════════════
  deploy_hosting:
    name: 4 · Deploy Hosting
    needs: deploy_functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Recuperar el bundle compilado por el job quality (evita recompilar).
      - name: Descargar artefacto dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy Hosting
        uses: w9jds/firebase-action@v14.11.1
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: control-de-bolsas-89c88
