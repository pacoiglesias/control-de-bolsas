# Configuración de Google Cloud App Engine para Control de Bolsas ERP (Vite SPA)
runtime: nodejs22
instance_class: F1

env_variables:
  NODE_ENV: production

automatic_scaling:
  max_instances: 2

handlers:
  # 1. Assets estáticos con hash (servidos directo en el edge con cache inmutable)
  - url: /assets
    static_dir: dist/assets
    secure: always
    expiration: "365d"

  # 2. Recursos estáticos raíz
  - url: /(.*\.(js|css|png|jpg|jpeg|gif|svg|ico|json|webmanifest|woff|woff2|ttf))$
    static_files: dist/\1
    upload: dist/(.*\.(js|css|png|jpg|jpeg|gif|svg|ico|json|webmanifest|woff|woff2|ttf))$
    secure: always

  # 3. Fallback y healthcheck manejado por server.js
  - url: /.*
    script: auto
    secure: always
