<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Control Bolsas · Compra · Venta · Cobranza (v4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   TOKENS
========================================================================= */
:root{
  --paper:#EEEAE0; --paper-raised:#F7F4EC; --paper-sunk:#E6E1D4;
  --ink:#22262B; --ink-soft:#5B5F63; --ink-faint:#8B8F8C;
  --line:#D9D2C2; --line-soft:#E4DFD1;
  --accent:#B5762A; --accent-deep:#8A5A1E; --accent-tint:#F1E2CC;
  --sidebar:#20241F; --sidebar-ink:#E9E6DC; --sidebar-line:#3A3F36;
  --sidebar-hover:#2A2F26; --sidebar-active:#2E3427;
  --field:#FFFFFF;
  --ok:#2F7A52;        --ok-bg:#E1EFE6;
  --info:#2F6690;      --info-bg:#DEE9F0;
  --warn:#8A6D1F;      --warn-bg:#F1E7CE;
  --bad:#B23A2E;       --bad-bg:#F6DFDA;
  --cash:#1F6F6B;      --cash-bg:#DCEDEB;
  --radius:10px; --radius-sm:5px;
  --shadow:0 1px 2px rgba(34,38,43,.06), 0 1px 12px rgba(34,38,43,.04);
  --shadow-lg:0 12px 40px rgba(34,38,43,.22);
}
:root[data-theme="dark"]{
  --paper:#1B1D19; --paper-raised:#23261F; --paper-sunk:#171915;
  --ink:#E6E3D9; --ink-soft:#B2AFA4; --ink-faint:#7E7B72;
  --line:#3D4038; --line-soft:#32352D;
  --accent:#D4913C; --accent-deep:#E8AF5E; --accent-tint:#3A3226;
  --sidebar:#141610; --sidebar-ink:#D5D2C8; --sidebar-line:#2C2F27;
  --sidebar-hover:#22261D; --sidebar-active:#2A2F23;
  --field:#191B16;
  --ok:#4E9E74;        --ok-bg:#1A2B21;
  --info:#5B90B4;      --info-bg:#182530;
  --warn:#B79340;      --warn-bg:#2B2413;
  --bad:#D06C59;       --bad-bg:#301C17;
  --cash:#4FA39D;      --cash-bg:#152A29;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 1px 14px rgba(0,0,0,.25);
  --shadow-lg:0 12px 44px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);}
::selection{background:var(--accent-tint);color:var(--ink);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

.app-shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  background:var(--sidebar);color:var(--sidebar-ink);padding:20px 14px;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60;
}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--sidebar-line);margin-bottom:14px;}
.brand-mark{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff;}
.brand-sub{font-size:10.5px;color:#9BA093;margin-top:4px;letter-spacing:.06em;text-transform:uppercase;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);
  border:none;background:transparent;color:#C7CBC0;text-align:left;font-size:13px;
  font-weight:500;position:relative;transition:background .12s ease;width:100%;
}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:var(--sidebar-active);color:#fff;}
.nav-item.active::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:2px;}
.nav-num{font-family:'IBM Plex Mono';font-size:10.5px;color:#767B6E;width:18px;flex:none;}
.nav-item.active .nav-num{color:var(--accent);}
.nav-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-family:'IBM Plex Mono';padding:1px 6px;border-radius:20px;flex:none;}
.nav-badge.soft{background:var(--warn);}
.sidebar-foot{border-top:1px solid var(--sidebar-line);padding-top:12px;margin-top:10px;font-size:11px;color:#7D8274;display:flex;flex-direction:column;gap:6px;}
.sidebar-foot button{background:none;border:1px solid var(--sidebar-line);color:#C7CBC0;border-radius:var(--radius-sm);padding:7px 9px;font-size:11px;text-align:left;}
.sidebar-foot button:hover{border-color:var(--accent);color:#fff;}
#save-indicator{color:var(--accent);opacity:0;transition:opacity .3s;min-height:14px;}

/* ---------- TOPBAR (móvil) ---------- */
.topbar{display:none;position:sticky;top:0;z-index:55;background:var(--sidebar);color:#fff;
  align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));}
.topbar .t-title{font-family:'Space Grotesk';font-weight:600;font-size:14px;}
.icon-btn{background:transparent;border:1px solid var(--sidebar-line);color:#DDD;border-radius:var(--radius-sm);
  width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:59;}

/* ---------- MAIN ---------- */
.main{padding:0;overflow-x:hidden;min-width:0;}
.ribbon{background:var(--bad-bg);color:var(--bad);border-bottom:1px solid var(--bad);
  padding:10px 28px;font-size:13px;display:flex;align-items:center;gap:10px;font-weight:500;flex-wrap:wrap;}
.ribbon strong{font-family:'IBM Plex Mono';}
.ribbon button{margin-left:auto;background:var(--bad);color:#fff;border:none;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;}
.ribbon.soft{background:var(--warn-bg);color:var(--warn);border-bottom-color:var(--warn);}
.ribbon.soft button{background:var(--warn);color:#fff;}
.content{padding:24px 30px 70px;max-width:1500px;}
.page-head{margin-bottom:20px;}
.page-head h1{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em;}
.page-head p{margin:0;color:var(--ink-soft);font-size:13px;max-width:680px;line-height:1.55;}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:22px;}
.kpi-card{background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:var(--radius);padding:15px 16px 14px;box-shadow:var(--shadow);}
.kpi-card.clickable{cursor:pointer;transition:transform .1s ease,border-color .12s;}
.kpi-card.clickable:hover{border-color:var(--accent);transform:translateY(-1px);}
.kpi-label{font-size:11.5px;color:var(--ink-soft);line-height:1.35;margin-bottom:7px;min-height:30px;}
.kpi-value{font-family:'IBM Plex Mono';font-size:21px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.kpi-sub{font-size:11px;color:var(--ink-faint);margin-top:4px;line-height:1.4;}
.kpi-card.bad{background:var(--bad-bg);border-color:var(--bad);}
.kpi-card.bad .kpi-value,.kpi-card.bad .kpi-label{color:var(--bad);}
.kpi-card.warn{background:var(--warn-bg);border-color:var(--warn);}
.kpi-card.warn .kpi-value,.kpi-card.warn .kpi-label{color:var(--warn);}
.kpi-card.ok{background:var(--ok-bg);border-color:var(--ok);}
.kpi-card.ok .kpi-value,.kpi-card.ok .kpi-label{color:var(--ok);}
.kpi-card.cash{background:var(--cash-bg);border-color:var(--cash);}
.kpi-card.cash .kpi-value,.kpi-card.cash .kpi-label{color:var(--cash);}
.kpi-card.hero .kpi-value{font-size:30px;}

.params-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--accent-tint);
  border:1px solid var(--accent);border-radius:var(--radius);padding:12px 16px;margin-bottom:22px;font-size:12.5px;}
.params-row label{display:flex;align-items:center;gap:6px;color:var(--accent-deep);font-weight:500;}
.params-row input,.params-row select{width:88px;border:1px solid var(--accent);border-radius:var(--radius-sm);padding:5px 6px;background:var(--field);}
.params-row select{width:auto;}
.params-row .note{color:var(--accent-deep);opacity:.85;}
.config-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--paper-raised);
  border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;font-size:12.5px;box-shadow:var(--shadow);}
.config-row label{display:flex;align-items:center;gap:8px;font-weight:600;}
.hint{color:var(--ink-faint);font-size:11.5px;}
.balance-display{font-family:'IBM Plex Mono';font-size:34px;font-weight:700;color:var(--accent-deep);margin:2px 0 6px;letter-spacing:-.01em;}

/* ---------- CARD / TABLE ---------- */
.card{background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;}
.card-head{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.card-head h3{margin:0;font-size:14px;font-weight:600;}
.spacer{flex:1;min-width:0;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:var(--field);color:var(--ink-soft);padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:500;}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn{border:1px solid var(--line);background:var(--field);color:var(--ink);padding:7px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent-deep);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-deep);color:#fff;}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok);}
.btn-ok:hover{filter:brightness(1.08);color:#fff;}
.btn-danger{background:var(--bad);color:#fff;border-color:var(--bad);}
.btn-danger:hover{filter:brightness(1.08);color:#fff;}
.btn-sm{padding:5px 9px;font-size:11.5px;}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.data-table{border-collapse:collapse;width:100%;font-size:12.5px;}
table.data-table th{position:sticky;top:0;background:var(--paper-sunk);color:var(--ink-soft);text-align:left;
  padding:9px 10px;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;
  white-space:nowrap;border-bottom:1px solid var(--line);z-index:1;}
table.data-table th.sortable{cursor:pointer;user-select:none;}
table.data-table th.sortable:hover{color:var(--accent-deep);}
table.data-table td{padding:4px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;}
table.data-table tbody tr:hover{background:var(--paper-sunk);}
tr.row-vencido{background:var(--bad-bg);}
tr.row-vencido:hover{filter:brightness(.97);}
tr.row-porvencer{background:var(--warn-bg);}
tr.row-cerrado{opacity:.6;}
tr.row-cancelado{opacity:.45;text-decoration:line-through;}
th.sticky-col,td.sticky-col{position:sticky;left:0;background:var(--paper-raised);z-index:2;}
table.data-table thead th.sticky-col{background:var(--paper-sunk);z-index:3;}
tr.row-vencido td.sticky-col{background:var(--bad-bg);}
tr.row-porvencer td.sticky-col{background:var(--warn-bg);}
td.calc{background:var(--paper-sunk);font-weight:500;}
td.num,th.num{text-align:right;}
tfoot td{padding:10px;font-weight:600;background:var(--paper-sunk);border-top:2px solid var(--line);
  font-family:'IBM Plex Mono';font-size:12px;position:sticky;bottom:0;}

.input{width:100%;min-width:76px;border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);padding:6px;color:var(--ink);}
.input:hover{border-color:var(--line);}
.input:focus{outline:none;border-color:var(--accent);background:var(--field);box-shadow:0 0 0 2px var(--accent-tint);}
.input.boxed{border-color:var(--line);background:var(--field);}
input[type=text].input{min-width:110px;}
input[type=date].input{min-width:118px;}
input[type=number].input{min-width:90px;text-align:right;}
input[type=number].input::-webkit-outer-spin-button,input[type=number].input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number].input{-moz-appearance:textfield;}
select.input{min-width:120px;appearance:none;cursor:pointer;padding-right:22px;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M5.5 7.5L10 12l4.5-4.5' stroke='%238B8F8C' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 5px center;}
select.sel-cobranza{font-weight:600;font-size:11.5px;border-color:var(--line);background-color:var(--field);}
select.sel-cobranza[data-v="PENDIENTE"]{color:var(--warn);}
select.sel-cobranza[data-v="PARCIAL"]{color:var(--info);}
select.sel-cobranza[data-v="COBRADO"]{color:var(--ok);}
select.sel-cobranza[data-v="DEPOSITADO"]{color:var(--cash);}
select.sel-cobranza[data-v="CANCELADO"]{color:var(--ink-faint);}
.search-input{border:1px solid var(--line);background:var(--field);border-radius:20px;padding:8px 14px;min-width:210px;}
.search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint);}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;font-family:'IBM Plex Mono';white-space:nowrap;}
.b-ok{background:var(--ok-bg);color:var(--ok);}
.b-info{background:var(--info-bg);color:var(--info);}
.b-warn{background:var(--warn-bg);color:var(--warn);}
.b-bad{background:var(--bad);color:#fff;}
.b-cash{background:var(--cash-bg);color:var(--cash);}
.b-mute{background:var(--paper-sunk);color:var(--ink-faint);}

.notas-cell{color:var(--ink-faint);font-size:11px;font-style:italic;white-space:normal;min-width:180px;max-width:260px;}
.col-actions{width:1%;text-align:right;white-space:nowrap;}
.btn-icon{border:none;background:transparent;color:var(--ink-faint);width:28px;height:28px;border-radius:5px;font-size:13px;line-height:1;}
.btn-icon:hover{background:var(--paper-sunk);color:var(--ink);}
.btn-icon.danger:hover{background:var(--bad-bg);color:var(--bad);}
.legend{display:flex;gap:15px;flex-wrap:wrap;padding:10px 16px 14px;font-size:11px;color:var(--ink-faint);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.empty{padding:26px 18px;color:var(--ink-faint);font-size:12.5px;text-align:center;}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:1050px){.mini-grid{grid-template-columns:1fr;}}
footer.app-footer{padding:16px 30px 40px;color:var(--ink-faint);font-size:11px;}

/* barras de resumen mensual */
.bar-row{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:center;padding:5px 0;font-size:11.5px;}
.bar-track{position:relative;height:22px;background:var(--paper-sunk);border-radius:4px;overflow:hidden;}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;}
.bar-fill.fact{background:var(--info);opacity:.35;}
.bar-fill.cob{background:var(--ok);opacity:.75;height:10px;top:6px;}
.bar-legend{font-size:11px;color:var(--ink-faint);display:flex;gap:14px;padding:6px 0 2px;}

/* ---------- CADENA DE AVANCE DEL PEDIDO ---------- */
.chain{display:flex;gap:3px;min-width:130px;}
.chain-seg{flex:1;height:7px;background:var(--paper-sunk);border-radius:3px;overflow:hidden;border:1px solid var(--line-soft);}
.chain-fill{height:100%;display:block;}
.chain-fill.s1{background:var(--info);} .chain-fill.s2{background:var(--accent);}
.chain-fill.s3{background:var(--ok);}   .chain-fill.s4{background:var(--cash);}
.chain-big{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 2px;}
.chain-card{border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:9px 10px;background:var(--paper-sunk);}
.chain-card .cl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);}
.chain-card .cv{font-family:'IBM Plex Mono';font-size:14px;font-weight:700;margin-top:2px;}
.chain-card .cp{font-size:10.5px;color:var(--ink-soft);}
@media (max-width:620px){.chain-big{grid-template-columns:1fr 1fr;}}
.faltante-pill{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:8px 11px;font-size:12px;margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.link-list{font-size:12px;}
.link-list .li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
.link-list .li:last-child{border-bottom:none;}
.link-list .li .lg{flex:1;min-width:150px;}
.link-list .li .lv{font-family:'IBM Plex Mono';font-weight:600;}

/* ---------- CASCADA DEL DINERO ---------- */
.flow{padding:4px 16px 16px;}
.flow-step{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:baseline;padding:11px 0;position:relative;}
.flow-step + .flow-step{border-top:1px dashed var(--line);}
.flow-n{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--ink-faint);padding-top:3px;}
.flow-t{font-size:13px;font-weight:600;}
.flow-d{font-size:11.5px;color:var(--ink-soft);line-height:1.45;margin-top:2px;font-weight:400;}
.flow-v{font-family:'IBM Plex Mono';font-size:16px;font-weight:700;white-space:nowrap;text-align:right;}
.flow-step.sub{padding-left:26px;}
.flow-step.sub .flow-t{font-weight:500;font-size:12.5px;}
.flow-step.sub .flow-v{font-size:14px;}
.flow-v.bad{color:var(--bad);} .flow-v.ok{color:var(--ok);} .flow-v.warn{color:var(--warn);} .flow-v.cash{color:var(--cash);}
.flow-step.head{background:var(--paper-sunk);margin:0 -16px;padding-left:16px;padding-right:16px;}
@media (max-width:600px){
  .flow-step{grid-template-columns:1fr auto;}
  .flow-n{display:none;}
}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,22,18,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  width:100%;max-width:720px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
.modal.wide{max-width:900px;}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;}
.modal-head h3{margin:0;font-size:15px;font-weight:600;}
.modal-body{padding:18px;overflow-y:auto;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.field .input{border-color:var(--line);background:var(--field);}
.field.full{grid-column:1/-1;}
textarea.input{min-height:70px;resize:vertical;padding:8px;}
.calc-box{background:var(--paper-sunk);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:6px;}
.calc-line{display:flex;justify-content:space-between;gap:12px;}
.calc-line.total{border-top:1px solid var(--line);padding-top:6px;font-weight:700;font-size:14px;}
.import-textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--field);resize:vertical;}
.import-error{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;margin-bottom:12px;}

const escAttr = (s) => String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const diasEntre = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);

/* ---------- ALMACENAMIENTO HÍBRIDO ----------
   Usa window.storage cuando existe (artefacto de Claude) y siempre espeja a
   localStorage, para que el mismo archivo funcione descargado en tu compu. */
const STORAGE_KEY = 'control-bolsas-v4';
const LEGACY_KEYS = ['sistema-control-bolsas-v3','sistema-control-bolsas-v1'];
const hasCloud = () => (typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function');

const DB = {
  async get(key){
    if(hasCloud()){
      try{ const r = await window.storage.get(key, false); if(r && r.value) return r.value; }catch(e){}
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  async set(key, value){
    let okCloud = true, okLocal = true;
    if(hasCloud()){ try{ await window.storage.set(key, value, false); }catch(e){ okCloud = false; } }
    try{ localStorage.setItem(key, value); }catch(e){ okLocal = false; }
    if(!okLocal && !okCloud) throw new Error('sin almacenamiento');
    return true;
  }
};

/* Deja cualquier factura (nueva, vieja o importada) con todos los campos v4 */
function normalizeFactura(f){
  f.folio = f.folio ?? '';
  f.cliente = f.cliente ?? '';
  f.receptor = f.receptor ?? '';
  f.oc = f.oc ?? '';
  f.fechaFactura = f.fechaFactura ?? '';
  f.montoTotal = num(f.montoTotal);
  f.contrarecibo = f.contrarecibo === 'SI' ? 'SI' : 'NO';
  f.numContrarecibo = f.numContrarecibo ?? '';
  f.fechaContrarecibo = f.fechaContrarecibo ?? '';
  f.fechaVencimiento = f.fechaVencimiento ?? '';
  f.montoCobrado = num(f.montoCobrado);
  f.comision = num(f.comision);
  f.comisionManual = !!f.comisionManual;
  f.montoDepositado = num(f.montoDepositado);
  f.fechaCobro = f.fechaCobro || '';
  f.fechaDeposito = f.fechaDeposito || '';
  if(!Array.isArray(f.cajaMovIds)) f.cajaMovIds = f.cajaMovId ? [f.cajaMovId] : [];
  delete f.cajaMovId;
  f.notas = f.notas ?? '';
  f.historial = Array.isArray(f.historial) ? f.historial : [];
  if(!f.cobranza){
    // migración desde versiones sin flujo de cobranza
    const legacy = f.estadoCobranza;
    if(legacy === 'DEPOSITADO') f.cobranza = 'DEPOSITADO';
    else if(legacy === 'COBRADO') f.cobranza = 'COBRADO';
    else if(f.montoTotal>0 && f.montoCobrado >= f.montoTotal) f.cobranza = 'COBRADO';
    else if(f.montoCobrado > 0) f.cobranza = 'PARCIAL';
    else f.cobranza = 'PENDIENTE';
  }
  delete f.estadoCobranza;
  return f;
}

function normalizePedido(p){
  p.folio = p.folio ?? '';
  p.cliente = p.cliente ?? '';
  p.oc = p.oc ?? '';
  p.fechaPedido = p.fechaPedido || '';
  p.fechaPrometida = p.fechaPrometida || '';
  p.kilos = num(p.kilos);
  p.precioKilo = num(p.precioKilo);
  p.costoKilo = num(p.costoKilo);
  p.proveedor = p.proveedor ?? '';
  p.estado = p.estado || 'Abierto';   // Abierto · Cerrado · Cancelado
  p.notas = p.notas ?? '';
  p.historial = Array.isArray(p.historial) ? p.historial : [];
  return p;
}
function logPedido(p, texto){
  p.historial = p.historial || [];
  p.historial.unshift({ ts: nowStamp(), texto });
  if(p.historial.length > 40) p.historial.length = 40;
}

let state = null;

let undoStack = [];            // snapshots para "Deshacer"
let renderDebounceTimer = null;
let lastFocusedField = null;
let pendingFocusId = null;

function snapshot(label){
  try{
    undoStack.push({ label, data: JSON.stringify({pedidos:state.pedidos, proveedores:state.proveedores, entregas:state.entregas, caja:state.caja, facturas:state.facturas}) });
    if(undoStack.length > 25) undoStack.shift();
  }catch(e){}
}
function undoLast(){
  const s = undoStack.pop();
  if(!s) return false;
  const d = JSON.parse(s.data);
  if(d.pedidos) state.pedidos = d.pedidos;
  state.proveedores = d.proveedores; state.entregas = d.entregas;
  state.caja = d.caja; state.facturas = d.facturas;
  scheduleSave(); render();
  return true;
}

function scheduleRenderDebounced(){
  clearTimeout(renderDebounceTimer);
  renderDebounceTimer = setTimeout(()=>{
    render();
    if(lastFocusedField){
      const {table,id,field} = lastFocusedField;
      const again = document.querySelector(`[data-table="${table}"][data-id="${id}"][data-field="${field}"]`);
      if(again){ again.focus(); try{ again.selectionStart = again.selectionEnd = again.value.length; }catch(_e){} }
    }
  }, 420);
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=> attemptSave(0), 350); }
async function attemptSave(retry){
  try{
    await DB.set(STORAGE_KEY, JSON.stringify(state));
    flashSave('Guardado ✓','');
  }catch(e){
    if(retry < 2) setTimeout(()=> attemptSave(retry+1), 600*(retry+1));
    else flashSave('⚠ No se pudo guardar — descarga un respaldo','var(--bad)', 7000);
  }
}
function flashSave(txt, color, ms){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  el.textContent = txt; el.style.color = color || ''; el.style.opacity = '1';
  clearTimeout(flashSave._t);

}

/* ¿Sigue contando como dinero que me deben? */
const debeDinero = (f) => (f.cobranza==='PENDIENTE' || f.cobranza==='PARCIAL');
const saldoDe = (f) => debeDinero(f) ? Math.max(num(f.montoTotal) - num(f.montoCobrado), 0) : 0;

/* Semáforo documental (contrarecibo + vencimiento) */
function estadoDoc(f){
  if(f.cobranza==='CANCELADO') return 'CANCELADO';
  if(f.cobranza==='DEPOSITADO') return 'DEPOSITADO';
  if(f.cobranza==='COBRADO') return 'COBRADO';
  if(f.contrarecibo !== 'SI') return 'SIN_CR';
  const hoy = todayISO();
  if(f.fechaVencimiento && f.fechaVencimiento < hoy) return 'VENCIDO';
  const dias = num(state.params.diasAvisoPrevio) || 5;
  if(f.fechaVencimiento && f.fechaVencimiento <= addDays(hoy, dias)) return 'POR_VENCER';
  return 'EN_PLAZO';
}
const DOC = {
  SIN_CR:     { label:'Falta contrarecibo', badge:'b-warn', dot:'var(--warn)' },
  EN_PLAZO:   { label:'En plazo',           badge:'b-info', dot:'var(--info)' },
  POR_VENCER: { label:'Por vencer',         badge:'b-warn', dot:'var(--warn)' },
  VENCIDO:    { label:'Vencido',            badge:'b-bad',  dot:'var(--bad)'  },
  COBRADO:    { label:'Cobrado',            badge:'b-ok',   dot:'var(--ok)'   },

};

/* Comisión: automática salvo que la hayas forzado a mano en la ficha */
function comisionAuto(f){
  const base = state.params.comisionBase === 'total' ? num(f.montoTotal) : num(f.montoCobrado);
  let c = base * num(state.params.porcentajeComision);
  if(state.params.comisionConIVA) c = c * (1 + num(state.params.iva));
  return r2(c);
}
function comisionDe(f){ return f.comisionManual ? r2(f.comision) : comisionAuto(f); }
function netoDe(f){ return r2(num(f.montoCobrado) - comisionDe(f)); }
/* Lo que realmente entra al banco el día del depósito:
   · modo "descuenta": contabilidad ya te restó su comisión → llega el neto
   · modo "aparte":    llega el importe completo y la comisión sale después */
function depositoEsperado(f){
  return state.params.comisionModo === 'aparte' ? r2(f.montoCobrado) : netoDe(f);
}
const COMISION_MODO_TXT = {
  descuenta: 'se descuenta del depósito',
  aparte: 'te la cobran por separado'
};
function sincronizarComision(f){ if(!f.comisionManual) f.comision = comisionAuto(f); }

function logFactura(f, texto){
  f.historial = f.historial || [];
  f.historial.unshift({ ts: nowStamp(), texto });
  if(f.historial.length > 40) f.historial.length = 40;
}

   PEDIDOS — la columna vertebral
   Un pedido amarra: la orden de compra del cliente, lo que le pediste al
   fabricante, lo que realmente te surtió, lo que entregaste, lo que
   facturaste y lo que cobraste. Todo lo demás cuelga de aquí.
========================================================================= */
const FASE = {
  PEDIDO:    {label:'Esperando al fabricante', badge:'b-info'},
  RETRASADO: {label:'Retrasado',               badge:'b-bad'},
  PARCIAL:   {label:'Surtido parcial',         badge:'b-warn'},
  SURTIDO:   {label:'Surtido completo',        badge:'b-info'},
  ENTREGADO: {label:'Entregado al cliente',    badge:'b-ok'},
  FACTURADO: {label:'Facturado',               badge:'b-ok'},
  COBRADO:   {label:'Cobrado y cerrado',       badge:'b-cash'},
  CANCELADO: {label:'Cancelado',               badge:'b-mute'},
};
function pedidoResumen(p){
  const compras  = state.proveedores.filter(r=>r.pedidoId===p.id);
  const entregas = state.entregas.filter(r=>r.pedidoId===p.id);
  const facturas = state.facturas.filter(f=>f.pedidoId===p.id);
  const iva = num(state.params.iva);

  const kSolicitado = num(p.kilos);
  const kPedidoFab  = sum(compras, r=>num(r.kilos));
  const kRecibido   = sum(compras, r=>num(r.kilosRecibidos));
  const kEntregado  = sum(entregas, r=>num(r.kilos));
  const faltante    = r2(Math.max(kSolicitado - kRecibido, 0));
  const enBodega    = r2(kRecibido - kEntregado);

  const costoReal   = r2(sum(compras, r=>num(r.kilosRecibidos)*num(r.costoKilo)));
  const pagadoFab   = r2(sum(compras, r=>num(r.abono)));
  const saldoFab    = r2(costoReal - pagadoFab);          // + le debes · − te debe

  const ventaEstimada = r2(kSolicitado*num(p.precioKilo)*(1+iva));
  const facturado   = r2(sum(facturas.filter(f=>f.cobranza!=='CANCELADO'), f=>num(f.montoTotal)));
  const cobrado     = r2(sum(facturas, f=>num(f.montoCobrado)));
  const porCobrar   = r2(sum(facturas, saldoDe));
  const comision    = r2(sum(facturas, f=> num(f.montoCobrado)>0 ? comisionDe(f) : 0));
  const entregadoSinFacturar = entregas.filter(e=>e.facturado!=='SI');
  const kSinFacturar = sum(entregadoSinFacturar, e=>num(e.kilos));
  const margen      = r2(facturado/(1+iva) - costoReal - comision);
  const margenPct   = facturado>0 ? (margen/(facturado/(1+iva)))*100 : null;

  const hoy = todayISO();
  const retrasado = p.estado==='Abierto' && p.fechaPrometida && p.fechaPrometida < hoy && kRecibido < kSolicitado - 0.01;

  let fase;
  if(p.estado==='Cancelado') fase='CANCELADO';
  else if(facturado>0 && porCobrar<=0.01) fase='COBRADO';
  else if(facturado>0) fase='FACTURADO';
  else if(retrasado) fase='RETRASADO';
  else if(kRecibido>0 && faltante>0.01 && p.estado==='Abierto') fase='PARCIAL';
  else if(kRecibido>0 && kEntregado>=kRecibido-0.01) fase='ENTREGADO';
  else if(kRecibido>0) fase='SURTIDO';
  else fase='PEDIDO';

  const pc = (a,b)=> b>0 ? Math.max(0, Math.min(100, (a/b)*100)) : 0;
  const avance = {
    surtido:   pc(kRecibido, kSolicitado),
    entregado: pc(kEntregado, kSolicitado),
    facturado: pc(facturado, ventaEstimada),
    cobrado:   facturado>0 ? pc(cobrado, facturado) : 0,
  };
  return { compras, entregas, facturas, kSolicitado, kPedidoFab, kRecibido, kEntregado, faltante, enBodega,
    costoReal, pagadoFab, saldoFab, ventaEstimada, facturado, cobrado, porCobrar, comision,
    entregadoSinFacturar, kSinFacturar, margen, margenPct, retrasado, fase, avance };
}

/* Días de atraso (positivo = vencido hace N días) */
function diasAtraso(f){
  if(!f.fechaVencimiento || !debeDinero(f)) return null;
  return diasEntre(f.fechaVencimiento, todayISO());
}

/* Antigüedad de saldos */
const AGING_BUCKETS = [

function bucketDe(f){
  const ref = f.fechaVencimiento || f.fechaFactura;
  if(!ref) return 'porvencer';
  const d = diasEntre(ref, todayISO());
  if(d <= 0) return 'porvencer';
  if(d <= 30) return 'd30';
  if(d <= 60) return 'd60';
  if(d <= 90) return 'd90';
  return 'd90p';
}

function computeKPIs(){
  const F = state.facturas;
  const activas = F.filter(f=>f.cobranza!=='CANCELADO');
  const porCobrar   = F.filter(debeDinero);
  const meDeben     = sum(porCobrar, saldoDe);
  const vencidas    = porCobrar.filter(f=> estadoDoc(f)==='VENCIDO');
  const montoVencido= sum(vencidas, saldoDe);
  const porVencer   = porCobrar.filter(f=> estadoDoc(f)==='POR_VENCER');
  const montoPorVencer = sum(porVencer, saldoDe);
  const sinCR       = porCobrar.filter(f=> f.contrarecibo!=='SI');
  const montoSinCR  = sum(sinCR, saldoDe);
  const conCR       = porCobrar.filter(f=> f.contrarecibo==='SI');
  const montoConCR  = sum(conCR, saldoDe);
  const cobradas    = F.filter(f=> f.cobranza==='COBRADO');
  const montoCobradoSinDepositar = sum(cobradas, f=> num(f.montoCobrado) - comisionDe(f));
  const depositadas = F.filter(f=> f.cobranza==='DEPOSITADO');
  const montoDepositado = sum(depositadas, f=> num(f.montoDepositado) || (num(f.montoCobrado)-comisionDe(f)));
  const comisionesTotales = sum(activas, f=> num(f.montoCobrado)>0 ? comisionDe(f) : 0);
  const totalFacturado = sum(activas, f=> num(f.montoTotal));

  const saldoPorFila = state.proveedores.map(r => r2(num(r.kilosRecibidos)*num(r.costoKilo) - num(r.abono)));
  const saldoProveedor = saldoPorFila.reduce((a,v)=>a+Math.max(v,0),0);
  const anticipoFabricante = saldoPorFila.reduce((a,v)=>a+Math.max(-v,0),0);
  const resPedidos = (state.pedidos||[]).map(p=>({p, r:pedidoResumen(p)}));
  const pedidosAbiertos = resPedidos.filter(({p,r})=> p.estado==='Abierto' && r.fase!=='COBRADO');
  const pedidosRetrasados = resPedidos.filter(({r})=>r.retrasado);
  const pedidosPorFacturar = resPedidos.filter(({r})=>r.kSinFacturar>0.01);
  const kilosPorSurtir = sum(pedidosAbiertos, ({r})=>r.faltante);
  const kilosComprometidos = sum(pedidosAbiertos, ({r})=>r.kSolicitado);
  const margenPedidos = sum(resPedidos.filter(({r})=>r.facturado>0), ({r})=>r.margen);
  const pendientePorFacturar = sum(state.entregas.filter(r=>r.facturado!=='SI'), r => num(r.kilos)*num(r.precioKilo)*(1+num(state.params.iva)));
  const cajaReal = sum(state.caja, r => num(r.entrada) - num(r.salida));
  const faltaCubrir = Math.max(saldoProveedor - cajaReal, 0);
  const diasAviso = num(state.params.diasAvisoPrevio) || 5;

  const kilosComprados = sum(state.proveedores, r=>num(r.kilosRecibidos));
  const kilosOrdenados = sum(state.proveedores, r=>num(r.kilos));
  const kilosEntregados = sum(state.entregas, r=>num(r.kilos));
  const compraTotal = sum(state.proveedores, r=>num(r.kilosRecibidos)*num(r.costoKilo));
  const abonosProveedor = sum(state.proveedores, r=>num(r.abono));

  return { meDeben, porCobrar, vencidas, montoVencido, porVencer, montoPorVencer, sinCR, montoSinCR, conCR, montoConCR,
    kilosComprados, kilosOrdenados, kilosEntregados, compraTotal, abonosProveedor, anticipoFabricante,
    resPedidos, pedidosAbiertos, pedidosRetrasados, pedidosPorFacturar, kilosPorSurtir, kilosComprometidos, margenPedidos,
    cobradas, montoCobradoSinDepositar, depositadas, montoDepositado, comisionesTotales, totalFacturado,
    saldoProveedor, pendientePorFacturar, cajaReal, faltaCubrir, diasAviso };
}

/* =========================================================================
   IMPORTAR CONTRARECIBOS DEL PORTAL (pegado directo)
========================================================================= */
function parseFechaDMY(s){
  if(!s) return '';
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return '';
  return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
function parseMoneyMX(s){
  if(!s) return 0;
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}
function parseContrarecibosPaste(text){
  const clean = String(text||'').replace(/\u00A0/g,' ');
  const re = /(\d+)\s+([A-Za-z0-9]+-[A-Za-z0-9]+)\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+([\d,]+\.\d{1,2})\s+([\d,]+\.\d{1,2})\s+([\d,]+\.\d{1,2})\s+([A-Za-zÁÉÍÓÚÑáéíóúñ]{2,6})\s+(\d+(?:\.\d+)?)\s+([A-Za-zÁÉÍÓÚÑáéíóúñ]+)/g;
  const rows = []; let m;
  while((m = re.exec(clean)) !== null){
    rows.push({
      numContrarecibo: m[2].trim().toUpperCase(),
      fechaContrarecibo: parseFechaDMY(m[3]),
      fechaVencimiento: parseFechaDMY(m[4]),
      montoTotal: parseMoneyMX(m[5]),
      montoCobrado: parseMoneyMX(m[6]),
      moneda: m[8].toUpperCase(), tc: num(m[9]), estatus: m[10].toUpperCase(),
    });
  }
  return rows;
}
function matchImportRow(row){
  const existing = state.facturas.find(f => (f.numContrarecibo||'').trim().toUpperCase() === row.numContrarecibo);
  if(existing){
    const igual = Math.abs(num(existing.montoTotal)-row.montoTotal)<0.01
      && existing.fechaVencimiento===row.fechaVencimiento
      && Math.abs(num(existing.montoCobrado)-row.montoCobrado)<0.01;
    return { status: igual ? 'duplicado' : 'actualizar', targetId: existing.id };
  }
  const cand = state.facturas.filter(f => f.contrarecibo!=='SI' && Math.abs(num(f.montoTotal)-row.montoTotal)<0.01);
  if(cand.length===1) return { status:'vincular', targetId: cand[0].id };
  if(cand.length>1)  return { status:'ambiguo', targetId:null };
  return { status:'nuevo', targetId:null };
}
function buildImportPreview(rows){
  return rows.map(row => { const m = matchImportRow(row); return {...row, ...m, included: m.status!=='duplicado'}; });
}
function applyImportRow(row){
  if(row.targetId){
    const f = state.facturas.find(x=>x.id===row.targetId);
    if(!f) return;
    f.contrarecibo='SI'; f.numContrarecibo=row.numContrarecibo;
    f.fechaContrarecibo=row.fechaContrarecibo; f.fechaVencimiento=row.fechaVencimiento;
    if(row.montoCobrado>0){
      f.montoCobrado = row.montoCobrado;
      f.cobranza = (row.montoCobrado >= num(f.montoTotal)-0.01) ? 'COBRADO' : 'PARCIAL';
      if(!f.fechaCobro) f.fechaCobro = todayISO();
      sincronizarComision(f);
    }
    logFactura(f, `Contrarecibo ${row.numContrarecibo} importado del portal.`);
  } else {
    const nueva = normalizeFactura({
      id:uid(), seq:seqCounter++, folio:'(sin folio portal)', cliente:'', receptor:'', oc:'', fechaFactura:'',
      montoTotal:row.montoTotal, contrarecibo:'SI', numContrarecibo:row.numContrarecibo,
      fechaContrarecibo:row.fechaContrarecibo, fechaVencimiento:row.fechaVencimiento,
      montoCobrado:row.montoCobrado,
      notas:`Contrarecibo ${row.numContrarecibo} importado del portal — no se encontró factura pendiente con el mismo monto. Confirma folio y cliente.`
    });
    if(row.montoCobrado>0){ nueva.cobranza = row.montoCobrado>=row.montoTotal-0.01 ? 'COBRADO':'PARCIAL'; nueva.fechaCobro=todayISO(); }
    sincronizarComision(nueva);
    logFactura(nueva, 'Creada desde importación del portal.');
    state.facturas.push(nueva);
  }
}

      return `<tfoot><tr><td colspan="3">Totales (${rows.length})</td><td class="num">${k.toLocaleString('es-MX')}</td><td></td><td class="num">${money(v)}</td><td colspan="2">Sin facturar: ${money(p)}</td><td></td></tr></tfoot>`;
    }
  },
  caja: {
    label:'Caja', num:'04', title:'Caja',
    subtitle:'Flujo de efectivo real. Los depósitos de facturas y los abonos al proveedor entran aquí solos; la ↗ te lleva al documento que originó cada movimiento.',
    columns:[
      {key:'fecha', label:'Fecha', type:'date'},
      {key:'concepto', label:'Concepto', type:'text'},
      {key:'entrada', label:'Entradas (+)', type:'money'},
      {key:'salida', label:'Salidas (–)', type:'money'},
      {key:'tipo', label:'Tipo', type:'select', options:['Efectivo','Transferencia','Depósito','Cheque']},
      {key:'saldoAcumulado', label:'Saldo acumulado', type:'money', calc:null},
    ],
    newRow:()=>({id:uid(), seq:seqCounter++, fecha:todayISO(), concepto:'', entrada:0, salida:0, tipo:'Transferencia', facturaId:null}),
    sort:(a,b)=> (a.fecha||'').localeCompare(b.fecha||'') || a.seq-b.seq,
    footer:(rows)=>{
      const e=sum(rows,r=>num(r.entrada)), s=sum(rows,r=>num(r.salida));
      return `<tfoot><tr><td colspan="2">Totales (${rows.length})</td><td class="num">${money(e)}</td><td class="num">${money(s)}</td><td></td><td class="num">${money(e-s)}</td><td></td></tr></tfoot>`;
    }
  },
};

/* La ruta completa del dinero, de la compra al banco. Cada renglón sale de un
   módulo distinto, así se ve dónde está parado cada peso y por qué. */
function renderCascada(){
  const k = computeKPIs();
  const deudaProv = k.compraTotal - k.abonosProveedor;
  const kilosDisp = k.kilosComprados - k.kilosEntregados;
  void kilosDisp;
  const entregadoSinFacturar = k.pendientePorFacturar;
  const cobradoBruto = sum(state.facturas, f=>num(f.montoCobrado));
  const step = (n, titulo, desc, valor, clase, extra) => `
    <div class="flow-step ${extra||''}">
      <span class="flow-n">${n}</span>
      <span><span class="flow-t">${titulo}</span><span class="flow-d">${desc}</span></span>
      <span class="flow-v ${clase||''}">${valor}</span>
    </div>`;
  return `
  <div class="card">
    <div class="card-head"><h3>Dónde está parado tu dinero</h3><div class="spacer"></div>
      <span class="hint">de la compra al banco, renglón por renglón</span></div>
    <div class="flow">
      ${step('01','Pedidos en curso de tus clientes',
        `${k.pedidosAbiertos.length} pedido${k.pedidosAbiertos.length===1?'':'s'} · ${kg(k.kilosComprometidos)} comprometidos`,
        money(sum(k.pedidosAbiertos,({r})=>r.ventaEstimada)))}
      ${step('02','Le ordenaste al fabricante',
        `${kg(k.kilosOrdenados)} pedidos · te ha surtido ${kg(k.kilosComprados)}${k.kilosPorSurtir>0?` · faltan ${kg(k.kilosPorSurtir)}`:''}`,
        kg(k.kilosComprados), k.kilosPorSurtir>0?'warn':'')}
      ${step('03','Costo de lo que sí recibiste',
        `Solo cuenta lo surtido · ya le abonaste ${money(k.abonosProveedor)}`,
        money(k.compraTotal))}
      ${step('','Le debes al proveedor','Sale de Proveedores: total de compras menos abonos',
        money(deudaProv), deudaProv>0?'bad':'ok','sub')}
      ${k.anticipoFabricante>0 ? step('','Anticipos a tu favor con el fabricante','Le pagaste kilos que todavía no te entrega',
        money(k.anticipoFabricante), 'ok', 'sub') : ''}
      ${step('04','Entregaste a clientes',
        `${kg(k.kilosEntregados)} de los ${kg(k.kilosComprados)} recibidos · quedan ${kg(k.kilosComprados-k.kilosEntregados)} en tu poder`,
        kg(k.kilosEntregados))}
      ${step('','Entregado y todavía sin facturar','Esos kilos ya salieron pero aún no hay factura que cobrar',
        money(entregadoSinFacturar), entregadoSinFacturar>0?'warn':'', 'sub')}
      ${step('05','Facturaste','Suma de todas las facturas activas, cobradas y no cobradas',
        money(k.totalFacturado))}
      ${step('06','TE DEBEN','Facturas abiertas: lo facturado menos lo que ya te pagaron',
        money(k.meDeben), k.meDeben>0?'bad':'ok','head')}
      ${step('','Ya con contrarecibo','El cliente lo aceptó y el plazo de pago ya está corriendo',
        money(k.montoConCR), '', 'sub')}
      ${step('','De eso, vencido','Pasó la fecha y sigue sin pagarse — aquí es donde hay que empujar',
        money(k.montoVencido), k.montoVencido>0?'bad':'ok','sub')}
      ${step('','Falta generar el contrarecibo','Facturas enviadas que ni siquiera empezaron a contar plazo',
        money(k.montoSinCR), k.montoSinCR>0?'warn':'ok','sub')}
      ${step('07','Ya te pagaron (bruto)','Suma de todo lo cobrado, antes de la comisión de contabilidad',
        money(cobradoBruto), 'ok')}
      ${step('','Comisión de contabilidad',
        `${pct(state.params.porcentajeComision)}${state.params.comisionConIVA?' + IVA':''} sobre ${state.params.comisionBase==='total'?'lo facturado':'lo cobrado'} · ${COMISION_MODO_TXT[state.params.comisionModo]}`,
        '− '+money(k.comisionesTotales), 'warn', 'sub')}
      ${step('','Neto que te queda de lo cobrado','Cobrado menos comisión',
        money(cobradoBruto - k.comisionesTotales), 'ok', 'sub')}
      ${step('08','Cobrado pero sin depositar','Ya está autorizado o pagado, pero todavía no lo ves en el banco',
        money(k.montoCobradoSinDepositar), k.montoCobradoSinDepositar>0?'warn':'')}
      ${step('09','Depositado','Dinero que ya entró y se registró en Caja',
        money(k.montoDepositado), 'cash')}
      ${step('10','Caja real hoy','Todas las entradas menos todas las salidas registradas en Caja',
        money(k.cajaReal), 'cash','head')}
      ${step('','Si le pagaras hoy todo al proveedor', deudaProv>k.cajaReal
          ? 'No te alcanza con la caja actual: te faltarían' : 'Te alcanza y te sobrarían',
        money(Math.abs(k.cajaReal - deudaProv)), deudaProv>k.cajaReal?'bad':'ok','sub')}
    </div>
  </div>`;
}

function renderAccionesSugeridas(){
  const acciones = [];
  const hoy = todayISO();
  state.facturas.filter(debeDinero).forEach(f=>{
    const est = estadoDoc(f);
    if(est==='VENCIDO'){
      acciones.push({prio:1, txt:`Cobrar <strong>${escHtml(f.numContrarecibo||f.folio)}</strong> — venció hace ${diasEntre(f.fechaVencimiento,hoy)} días · ${money(saldoDe(f))}`, id:f.id});
    } else if(f.contrarecibo!=='SI' && f.fechaFactura && diasEntre(f.fechaFactura,hoy) > 15){
      acciones.push({prio:2, txt:`Generar contrarecibo de la factura <strong>${escHtml(f.folio)}</strong> — lleva ${diasEntre(f.fechaFactura,hoy)} días sin gestionar · ${money(saldoDe(f))}`, id:f.id});
    } else if(est==='POR_VENCER'){
      acciones.push({prio:3, txt:`Preparar cobro de <strong>${escHtml(f.numContrarecibo||f.folio)}</strong> — vence ${dispDate(f.fechaVencimiento)} · ${money(saldoDe(f))}`, id:f.id});
    }
  });
  if(!acciones.length) return '';
  acciones.sort((a,b)=>a.prio-b.prio);
  const top = acciones.slice(0,6);
  return `
  <div class="card">
    <div class="card-head"><h3>Qué conviene hacer hoy</h3><span class="spacer"></span><span class="hint">${acciones.length} pendiente${acciones.length===1?'':'s'}</span></div>
    <div style="padding:6px 16px 14px;">
      ${top.map(a=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;">
        <span style="flex:1">${a.txt}</span>
        <button class="btn btn-sm no-print" data-action="ficha" data-id="${a.id}">Abrir ficha</button>
      </div>`).join('')}
      ${acciones.length>top.length?`<div class="hint" style="padding-top:10px">y ${acciones.length-top.length} más en Reportes y seguimiento.</div>`:''}
    </div>
  </div>`;
}

function miniFacturasTable(rows, emptyTxt){
  if(!rows.length) return `<div class="empty">${emptyTxt}</div>`;
  return `<table class="data-table"><thead><tr><th>Folio / CR</th><th>Cliente</th><th>Vence</th><th class="num">Saldo</th><th></th></tr></thead><tbody>
    ${rows.map(f=>`<tr>
      <td class="mono">${escHtml(f.numContrarecibo || f.folio)}</td>
      <td>${escHtml(f.cliente)||'—'}</td>
      <td class="mono">${dispDate(f.fechaVencimiento)}</td>
      <td class="num mono">${money(saldoDe(f))}</td>
      <td class="col-actions no-print"><button class="btn-icon" data-action="ficha" data-id="${f.id}" title="Abrir ficha">↗</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}

/* =========================================================================
   RENDER — MÓDULOS SIMPLES (proveedores / entregas / caja)
========================================================================= */
function renderGenericModule(key){
  const cfg = TABLES[key];
  let rows = [...state[key]].sort(cfg.sort);
  if(key==='entregas'){
    const f = state.entregaFilter || 'TODAS';
    if(f==='PENDIENTE') rows = rows.filter(r=>r.facturado!=='SI');
    if(f==='FACTURADA') rows = rows.filter(r=>r.facturado==='SI');
  }
  let running = 0;
  const thead = cfg.columns.map((c,i)=>`<th class="${i===0?'sticky-col':''} ${['money','number'].includes(c.type)?'num':''}">${c.label}</th>`).join('');
  const body = rows.map(r=>{
    const cells = cfg.columns.map((c,i)=>{
      if(key==='caja' && c.key==='saldoAcumulado'){
        running += num(r.entrada)-num(r.salida);
        return `<td class="calc num"><span class="mono">${money(running)}</span></td>`;
      }
      if(key==='proveedores' && c.key==='abono'){
        return `<td><div style="display:flex;align-items:center;gap:2px;">
          <input class="input mono" type="number" step="0.01" data-table="proveedores" data-id="${r.id}" data-field="abono" value="${r.abono}">
          <button class="btn-icon no-print" data-action="quick-abono" data-id="${r.id}" title="Sumar un abono nuevo">＋</button></div></td>`;
      }
      return renderCell(key,r,c,i===0);
    }).join('');
    const cls = (key==='entregas' && r.facturado==='SI') ? 'row-cerrado' : '';
    const quick = (key==='entregas' && r.facturado!=='SI')
      ? `<button class="btn-icon no-print" data-action="facturar-entrega" data-id="${r.id}" title="Crear la factura de esta entrega">📄</button>` : '';
    const verFact = (key==='entregas' && r.facturaId)
      ? `<button class="btn-icon no-print" data-action="ficha" data-id="${r.facturaId}" title="Ver la factura ligada">↗</button>` : '';
    const link = (key==='caja' && r.facturaId) ? `<button class="btn-icon no-print" data-action="ficha" data-id="${r.facturaId}" title="Ver la factura que originó este movimiento">↗</button>` : '';
    return `<tr data-row-id="${r.id}" class="${cls}">${cells}<td class="col-actions no-print">${quick}${verFact}${link}<button class="btn-icon danger" data-action="delete" data-table="${key}" data-id="${r.id}" title="Eliminar fila">✕</button></td></tr>`;
  }).join('');

  let topExtra = '', big = '';
  if(key==='proveedores'){
    const nombre = state.catalogos.proveedores[0] || '';
    const saldo = sum(state.proveedores, r=>num(r.kilosRecibidos)*num(r.costoKilo)-num(r.abono));
    big = `<div class="balance-display">${money(saldo)}</div><div class="hint" style="margin-bottom:10px">Es lo que le debes por los kilos que <strong>ya te entregó</strong> a ${escHtml(nombre||'tu proveedor')}. Si sale en negativo, le pagaste de más y tienes un anticipo a tu favor.</div>`;
    topExtra = `<div class="config-row no-print">
      <label>Nombre del proveedor <input class="input boxed" type="text" id="config-proveedor-nombre" value="${escAttr(nombre)}" style="max-width:200px"></label>
      <span class="hint">Si lo cambias aquí, se actualiza en todas tus compras.</span></div>`;
  }
  if(key==='caja'){
    const saldo = sum(state.caja, r=>num(r.entrada)-num(r.salida));
    big = `<div class="balance-display">${money(saldo)}</div>`;
  }
  if(key==='entregas'){
    const nombreProv = state.catalogos.proveedores[0] || 'tu proveedor';
    const comprado = sum(state.proveedores, r=>num(r.kilosRecibidos));
    const costoProm = comprado>0 ? sum(state.proveedores, r=>num(r.kilosRecibidos)*num(r.costoKilo))/comprado : 0;
    const entregado = sum(state.entregas, r=>num(r.kilos));
    const disp = comprado - entregado;
    const pendK = sum(state.entregas.filter(r=>r.facturado!=='SI'), r=>num(r.kilos));
    const pendV = sum(state.entregas.filter(r=>r.facturado!=='SI'), r=>num(r.kilos)*num(r.precioKilo)*(1+num(state.params.iva)));
    const filt = state.entregaFilter || 'TODAS';
    const c = {TODAS:state.entregas.length, PENDIENTE:state.entregas.filter(r=>r.facturado!=='SI').length, FACTURADA:state.entregas.filter(r=>r.facturado==='SI').length};
    topExtra = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Kilos recibidos de ${escHtml(nombreProv)}</div><div class="kpi-value">${kg(comprado)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Kilos ya distribuidos</div><div class="kpi-value">${kg(entregado)}</div></div>
      <div class="kpi-card ${disp<0?'bad':''}"><div class="kpi-label">Kilos disponibles</div><div class="kpi-value">${kg(disp)}</div>${disp<0?'<div class="kpi-sub">Entregaste más de lo que compraste — revisa.</div>':''}</div>
      <div class="kpi-card"><div class="kpi-label">Valor de ese saldo a costo</div><div class="kpi-value">${money(disp*costoProm)}</div><div class="kpi-sub">Costo promedio ${money(costoProm)}/kg</div></div>
      <div class="kpi-card ${pendK>0?'warn':''}"><div class="kpi-label">Entregado sin facturar</div><div class="kpi-value">${kg(pendK)}</div><div class="kpi-sub">${money(pendV)} por facturar</div></div>
    </div>
    <div class="chip-row no-print" style="margin-bottom:16px;">
      ${[['TODAS',`Todas (${c.TODAS})`],['PENDIENTE',`Sin facturar (${c.PENDIENTE})`],['FACTURADA',`Ya facturadas (${c.FACTURADA})`]]
        .map(([k2,l])=>`<button class="chip ${filt===k2?'active':''}" data-action="filter-entregas" data-filter="${k2}">${l}</button>`).join('')}
    </div>`;
  }

  return `
  <div class="page-head"><h1>${cfg.title}</h1>${big}<p>${cfg.subtitle}</p></div>
  ${topExtra}
  <div class="card">
    <div class="card-head">
      <h3>Registros</h3><span class="hint">${rows.length} fila${rows.length===1?'':'s'}</span>
      <div class="spacer"></div>
      <button class="btn no-print" data-action="print" data-what="${key}">🖨 Imprimir</button>
      <button class="btn no-print" data-action="export-csv" data-table="${key}">⭳ CSV</button>
      <button class="btn btn-primary no-print" data-action="add-row" data-table="${key}">+ Agregar fila</button>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="table-${key}">
        <thead><tr>${thead}<th class="col-actions no-print"></th></tr></thead>
        <tbody>${body || `<tr><td colspan="${cfg.columns.length+1}"><div class="empty">Sin registros todavía. Usa “Agregar fila”.</div></td></tr>`}</tbody>
        ${cfg.footer ? cfg.footer(rows) : ''}
      </table>
    </div>
  </div>`;
}

function renderCell(table,row,col,sticky){
  const sc = sticky ? ' sticky-col' : '';
  if(col.calc){
    const v = col.calc(row);
    const txt = col.fmt==='kg' ? (v>0.001 ? v.toLocaleString('es-MX') : '—') : money(v);
    const color = (col.fmt==='kg' && v>0.001) ? 'color:var(--warn);font-weight:700' : '';
    return `<td class="calc num${sc}"><span class="mono" style="${color}">${txt}</span></td>`;
  }
  if(col.type==='pedidoSelect'){
    const opts = `<option value="">— sin pedido —</option>` +
      state.pedidos.map(p=>`<option value="${p.id}" ${row[col.key]===p.id?'selected':''}>${escHtml(p.folio)}${p.cliente?' · '+escHtml(p.cliente):''}</option>`).join('');
    return `<td class="${sc}"><select class="input" data-table="${table}" data-id="${row.id}" data-field="${col.key}" style="min-width:108px">${opts}</select></td>`;
  }
  if(col.type==='select'){
    const opts = col.options.map(o=>`<option value="${escAttr(o)}" ${row[col.key]===o?'selected':''}>${escHtml(o)}</option>`).join('');
    return `<td class="${sc}"><select class="input" data-table="${table}" data-id="${row.id}" data-field="${col.key}">${opts}</select></td>`;
  }
  if(col.type==='catalogSelect'){
    const cat = (state.catalogos && state.catalogos[col.catalogKey]) || [];
    const opts = `<option value="">— Selecciona —</option>` +
      cat.map(o=>`<option value="${escAttr(o)}" ${row[col.key]===o?'selected':''}>${escHtml(o)}</option>`).join('') +
      `<option value="__add_new__">+ Agregar nuevo…</option>`;
    return `<td class="${sc}"><select class="input" data-table="${table}" data-id="${row.id}" data-field="${col.key}" data-catalog="true" data-catalog-key="${col.catalogKey}">${opts}</select></td>`;
  }
  if(col.type==='date'){
    return `<td class="${sc}"><input class="input mono" type="date" data-table="${table}" data-id="${row.id}" data-field="${col.key}" value="${row[col.key]||''}"></td>`;
  }
  if(col.type==='money' || col.type==='number'){
    return `<td class="${sc}"><input class="input mono" type="number" step="0.01" data-table="${table}" data-id="${row.id}" data-field="${col.key}" value="${row[col.key]}"></td>`;
  }
  return `<td class="${sc}"><input class="input" type="text" data-table="${table}" data-id="${row.id}" data-field="${col.key}" value="${escAttr(row[col.key])}"></td>`;
}

/* =========================================================================
   FACTURAS Y COBRANZA
========================================================================= */
const FILTROS_FACTURA = [
  {k:'TODAS',      label:'Todas'},
  {k:'POR_COBRAR', label:'Te deben'},
  {k:'CON_CR',     label:'Con contrarecibo'},
  {k:'SIN_CR',     label:'Falta contrarecibo'},
  {k:'VENCIDO',    label:'Vencidas'},
  {k:'POR_VENCER', label:'Por vencer'},
  {k:'EN_PLAZO',   label:'En plazo'},
  {k:'COBRADO',    label:'Cobradas'},
  {k:'DEPOSITADO', label:'Depositadas'},
];
function pasaFiltro(f, k){
  if(k==='TODAS') return true;
  if(k==='POR_COBRAR') return debeDinero(f);
  if(k==='COBRADO') return f.cobranza==='COBRADO';
  if(k==='DEPOSITADO') return f.cobranza==='DEPOSITADO';
  if(k==='SIN_CR') return debeDinero(f) && f.contrarecibo!=='SI';
  if(k==='CON_CR') return debeDinero(f) && f.contrarecibo==='SI';
  return estadoDoc(f)===k;
}
function facturasFiltradas(){
  const k = state.facturaFilter || 'TODAS';
  const q = (state.facturaSearch||'').trim().toLowerCase();
  let rows = state.facturas.filter(f=>pasaFiltro(f,k));
  if(q){
    rows = rows.filter(f => [f.folio,f.cliente,f.numContrarecibo,f.oc,f.receptor,f.notas,String(f.montoTotal)]
      .join(' ').toLowerCase().includes(q));
  }
  const s = state.facturaSort || {key:'fechaFactura', dir:-1};
  const val = (f) => {
    switch(s.key){
      case 'folio': return f.folio||'';
      case 'cliente': return f.cliente||'';
      case 'montoTotal': return num(f.montoTotal);
      case 'saldo': return saldoDe(f);
      case 'fechaVencimiento': return f.fechaVencimiento||'9999';
      default: return f.fechaFactura||'';
    }
  };
  rows.sort((a,b)=>{
    const va=val(a), vb=val(b);
    if(typeof va==='number') return (va-vb)*s.dir;
    return String(va).localeCompare(String(vb))*s.dir;
  });
  return rows;
}

    <div class="kpi-card ok clickable" data-action="filter-facturas" data-filter="COBRADO"><div class="kpi-label">Cobrado sin depositar (neto)</div><div class="kpi-value">${money(k.montoCobradoSinDepositar)}</div><div class="kpi-sub">${k.cobradas.length} factura${k.cobradas.length===1?'':'s'}</div></div>
    <div class="kpi-card cash"><div class="kpi-label">Depositado</div><div class="kpi-value">${money(k.montoDepositado)}</div><div class="kpi-sub">${k.depositadas.length} factura${k.depositadas.length===1?'':'s'}</div></div>

  </div>`;
}

/* =========================================================================
   RENDER — PEDIDOS
========================================================================= */
const FILTROS_PEDIDO = [
  {k:'ABIERTOS',  label:'En curso'},
  {k:'RETRASADO', label:'Retrasados'},
  {k:'PARCIAL',   label:'Con faltante'},
  {k:'PORFACT',   label:'Entregado sin facturar'},
  {k:'PORCOBRAR', label:'Facturado sin cobrar'},
  {k:'CERRADOS',  label:'Cerrados'},
  {k:'TODOS',     label:'Todos'},
];
function renderPedidos(){
  const filtro = state.pedidoFilter || 'ABIERTOS';
  const todos = state.pedidos.map(p=>({p, r:pedidoResumen(p)}));
  const pasa = ({p,r}) => {
    if(filtro==='TODOS') return true;
    if(filtro==='CERRADOS') return p.estado!=='Abierto' || r.fase==='COBRADO';
    if(filtro==='ABIERTOS') return p.estado==='Abierto' && r.fase!=='COBRADO';
    if(filtro==='RETRASADO') return r.retrasado;
    if(filtro==='PARCIAL') return r.faltante>0.01 && p.estado==='Abierto';
    if(filtro==='PORFACT') return r.kSinFacturar>0.01;
    if(filtro==='PORCOBRAR') return r.porCobrar>0.01;
    return true;
  };
  const rows = todos.filter(pasa).sort((a,b)=> (b.p.fechaPedido||'').localeCompare(a.p.fechaPedido||'') || b.p.seq-a.p.seq);
  const counts = {}; FILTROS_PEDIDO.forEach(c=>{ counts[c.k] = todos.filter(x=>{const f=filtro; state.pedidoFilter=c.k; const ok=pasa(x); state.pedidoFilter=f; return ok;}).length; });

  const abiertos = todos.filter(({p,r})=> p.estado==='Abierto' && r.fase!=='COBRADO');
  const kComprometidos = sum(abiertos, ({r})=>r.kSolicitado);
  const kPorSurtir = sum(abiertos, ({r})=>r.faltante);
  const kEnBodega = sum(todos, ({r})=>Math.max(r.enBodega,0));
  const valorEnJuego = sum(abiertos, ({r})=>r.ventaEstimada);
  const margenAcum = sum(todos.filter(({r})=>r.facturado>0), ({r})=>r.margen);
  const anticipoAFavor = sum(todos, ({r})=> r.saldoFab<0 ? -r.saldoFab : 0);
  const retrasados = todos.filter(({r})=>r.retrasado);

  const body = rows.map(({p,r})=>`
    <tr data-row-id="${p.id}" class="${r.retrasado?'row-vencido':(r.fase==='COBRADO'?'row-cerrado':(p.estado==='Cancelado'?'row-cancelado':''))}">
      <td class="sticky-col mono"><strong>${escHtml(p.folio)}</strong></td>
      <td>${escHtml(p.cliente)||'<span style="color:var(--ink-faint)">—</span>'}</td>
      <td class="mono">${escHtml(p.oc)||'—'}</td>
      <td class="mono">${dispDate(p.fechaPrometida)}</td>
      <td class="num mono">${num(p.kilos).toLocaleString('es-MX')}</td>
      <td class="num mono ${r.faltante>0.01?'':''}" style="${r.faltante>0.01?'color:var(--warn);font-weight:700':''}">${r.kRecibido.toLocaleString('es-MX')}</td>
      <td class="num mono" style="${r.faltante>0.01?'color:var(--bad);font-weight:700':'color:var(--ink-faint)'}">${r.faltante>0.01?'−'+r.faltante.toLocaleString('es-MX'):'0'}</td>
      <td class="num mono">${r.kEntregado.toLocaleString('es-MX')}</td>
      <td class="num mono">${r.facturado?money(r.facturado):'—'}</td>
      <td class="num mono" style="${r.porCobrar>0?'color:var(--bad);font-weight:700':''}">${r.porCobrar?money(r.porCobrar):'—'}</td>
      <td class="num mono" style="${r.margen>0?'color:var(--ok)':(r.margen<0?'color:var(--bad)':'')};font-weight:700">${r.facturado?money(r.margen):'—'}</td>
      <td>${chainMini(r.avance)}</td>
      <td><span class="badge ${FASE[r.fase].badge}">${FASE[r.fase].label}</span></td>
      <td class="col-actions no-print">
        <button class="btn-icon" data-action="pedido" data-id="${p.id}" title="Abrir el pedido">↗</button>
        <button class="btn-icon danger" data-action="delete" data-table="pedidos" data-id="${p.id}" title="Eliminar pedido">✕</button>
      </td>
    </tr>`).join('');

  const cards = rows.map(({p,r})=>`
    <div class="f-card ${r.retrasado?'vencido':(r.fase==='COBRADO'?'cerrado':'')}">
      <div class="f-row"><span class="f-folio">${escHtml(p.folio)}</span><span class="badge ${FASE[r.fase].badge}">${FASE[r.fase].label}</span></div>
      <div class="f-row"><span>${escHtml(p.cliente)||'sin cliente'}${p.oc?' · OC '+escHtml(p.oc):''}</span><span class="f-monto">${money(r.ventaEstimada)}</span></div>
      <div class="f-meta"><span>Pedido ${num(p.kilos).toLocaleString('es-MX')} kg</span><span>Recibido ${r.kRecibido.toLocaleString('es-MX')} kg</span>${r.faltante>0.01?`<span style="color:var(--bad)"><strong>Faltan ${r.faltante.toLocaleString('es-MX')} kg</strong></span>`:''}</div>
      <div class="f-meta"><span>Promete ${dispDate(p.fechaPrometida)}</span>${r.porCobrar>0?`<span>Por cobrar ${money(r.porCobrar)}</span>`:''}</div>
      ${chainMini(r.avance)}
      <div class="f-actions"><button class="btn btn-sm btn-primary" data-action="pedido" data-id="${p.id}">Abrir pedido</button></div>
    </div>`).join('');

  return `
  <div class="page-head">
    <h1>Pedidos</h1>
    <p>Cada pedido amarra la orden de compra del cliente, lo que le pediste al fabricante, lo que realmente te surtió, lo que entregaste y lo que cobraste. Si te piden 1,000 kg y el fabricante entrega 900, aquí se ve el faltante y qué pasó con el dinero de esos 100 kg.</p>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card hero"><div class="kpi-label">Comprometido con clientes</div><div class="kpi-value">${kg(kComprometidos)}</div><div class="kpi-sub">${abiertos.length} pedido${abiertos.length===1?'':'s'} en curso · ${money(valorEnJuego)} de venta</div></div>
    <div class="kpi-card ${kPorSurtir>0?'warn':'ok'}"><div class="kpi-label">Falta que el fabricante surta</div><div class="kpi-value">${kg(kPorSurtir)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Recibido y aún en tu poder</div><div class="kpi-value">${kg(kEnBodega)}</div><div class="kpi-sub">ya lo pagaste o lo debes, pero no ha salido</div></div>
    <div class="kpi-card ${retrasados.length?'bad':''}"><div class="kpi-label">Pedidos retrasados</div><div class="kpi-value">${retrasados.length}</div><div class="kpi-sub">pasó la fecha prometida sin surtir completo</div></div>
    <div class="kpi-card ${anticipoAFavor>0?'ok':''}"><div class="kpi-label">Anticipos a tu favor</div><div class="kpi-value">${money(anticipoAFavor)}</div><div class="kpi-sub">le pagaste al fabricante más de lo que te ha surtido</div></div>
    <div class="kpi-card ${margenAcum>0?'ok':''}"><div class="kpi-label">Margen de lo ya facturado</div><div class="kpi-value">${money(margenAcum)}</div><div class="kpi-sub">venta sin IVA − costo real − comisión</div></div>
  </div>

  <div class="card">
    <div class="card-head no-print">
      <div class="chip-row">${FILTROS_PEDIDO.map(c=>`<button class="chip ${filtro===c.k?'active':''}" data-action="filter-pedidos" data-filter="${c.k}">${c.label} (${counts[c.k]})</button>`).join('')}</div>
      <div class="spacer"></div>
      <button class="btn" data-action="print" data-what="pedidos">🖨 Imprimir</button>
      <button class="btn btn-primary" data-action="nuevo-pedido">+ Nuevo pedido</button>
    </div>
    <div class="table-scroll hide-mobile">
      <table class="data-table" id="table-pedidos">
        <thead><tr>
          <th class="sticky-col">Pedido</th><th>Cliente</th><th>O.C. del cliente</th><th>Promete</th>
          <th class="num">Pedido kg</th><th class="num">Recibido kg</th><th class="num">Faltante</th><th class="num">Entregado kg</th>
          <th class="num">Facturado</th><th class="num">Por cobrar</th><th class="num">Margen</th>
          <th>Avance</th><th>Fase</th><th class="col-actions no-print"></th>
        </tr></thead>
        <tbody>${body || `<tr><td colspan="14"><div class="empty">No hay pedidos en este filtro. Usa “Nuevo pedido” para arrancar uno.</div></td></tr>`}</tbody>
      </table>
    </div>
    <div class="cards-view">${cards || '<div class="empty">No hay pedidos en este filtro.</div>'}</div>
    <div class="legend">
      <span><span class="dot" style="background:var(--info)"></span>Surtido por el fabricante</span>
      <span><span class="dot" style="background:var(--accent)"></span>Entregado al cliente</span>
      <span><span class="dot" style="background:var(--ok)"></span>Facturado</span>
      <span><span class="dot" style="background:var(--cash)"></span>Cobrado</span>
    </div>
  </div>`;
}

/* =========================================================================
   REPORTES Y SEGUIMIENTO
========================================================================= */
function rangoActivo(){
  const r = state.reporteRango || {desde:'', hasta:'', cliente:''};
  return r;
}
function facturasReporte(){
  const r = rangoActivo();
  return state.facturas.filter(f=>{
    if(r.cliente && f.cliente !== r.cliente) return false;
    const fecha = f.fechaFactura || f.fechaContrarecibo || '';
    if(r.desde && fecha && fecha < r.desde) return false;
    if(r.hasta && fecha && fecha > r.hasta) return false;
    if((r.desde || r.hasta) && !fecha) return false;
    return true;
  });
}
function auditoria(){
  const problemas = [];
  const porMonto = {};
  state.facturas.forEach(f=>{
    const et = (t,d)=> problemas.push({tipo:t, det:d, id:f.id, folio:f.folio||f.numContrarecibo||'(sin folio)'});
    if(num(f.montoCobrado) > num(f.montoTotal)+0.01) et('Cobraste de más','Cobrado '+money(f.montoCobrado)+' contra un total de '+money(f.montoTotal));
    if((f.cobranza==='COBRADO'||f.cobranza==='DEPOSITADO') && num(f.montoCobrado)===0) et('Marcada como cobrada sin monto','Está en “'+COBRANZA[f.cobranza].label+'” pero el monto cobrado es cero');
    if(f.cobranza==='DEPOSITADO' && num(f.montoDepositado)===0) et('Depósito sin monto','Marcada como depositada pero no registraste cuánto entró');
    if(f.contrarecibo==='SI' && !f.numContrarecibo) et('Contrarecibo sin número','Dice que sí hay contrarecibo pero no tiene folio');
    if(f.contrarecibo==='SI' && !f.fechaVencimiento) et('Contrarecibo sin vencimiento','Sin fecha de vencimiento no se puede calcular el atraso');
    if(f.fechaContrarecibo && f.fechaVencimiento && f.fechaVencimiento < f.fechaContrarecibo) et('Fechas invertidas','Vence antes de la fecha del contrarecibo');
    if(num(f.montoTotal)===0) et('Monto en cero','La factura no tiene importe capturado');
    if(!f.cliente && debeDinero(f)) et('Sin cliente asignado','No sabes a quién cobrarle');
    if(!f.fechaFactura && f.folio && f.folio.indexOf('sin folio')<0) et('Sin fecha de factura','No entra en los cortes por periodo');
    if(f.fechaFactura && f.fechaContrarecibo && f.fechaContrarecibo < f.fechaFactura) et('Contrarecibo anterior a la factura','El contrarecibo tiene fecha '+dispDate(f.fechaContrarecibo)+' y la factura '+dispDate(f.fechaFactura));
    if(f.fechaCobro && f.fechaFactura && f.fechaCobro < f.fechaFactura) et('Cobro anterior a la factura','Dice que se cobró el '+dispDate(f.fechaCobro));
    const key = r2(f.montoTotal);
    if(key>0){ (porMonto[key] = porMonto[key] || []).push(f); }
  });
  Object.keys(porMonto).forEach(m=>{
    const g = porMonto[m];
    if(g.length>1){
      problemas.push({tipo:'Posible duplicado', det:`${g.length} facturas con el mismo importe de ${money(m)}: ${g.map(x=>x.folio||x.numContrarecibo||'?').join(', ')}`, id:g[0].id, folio:'—'});
    }
  });
  const comprado = sum(state.proveedores, r=>num(r.kilos));
  const entregado = sum(state.entregas, r=>num(r.kilos));
  if(entregado > comprado) problemas.push({tipo:'Inventario negativo', det:`Entregaste ${kg(entregado)} pero solo compraste ${kg(comprado)}`, id:null, folio:'—'});

  // Cruces entre módulos
  const folios = state.facturas.map(f=>(f.folio||'').trim()).filter(Boolean);
  state.entregas.forEach(e=>{
    if(e.facturado==='SI' && !e.facturaId){
      if(!e.folio) problemas.push({tipo:'Entrega facturada sin folio', det:`La entrega del ${dispDate(e.fecha)} (${kg(e.kilos)}) dice estar facturada pero no dice con qué factura`, id:null, folio:'—'});
      else if(!folios.includes(e.folio.trim())) problemas.push({tipo:'Folio que no existe', det:`La entrega del ${dispDate(e.fecha)} apunta al folio ${e.folio}, que no está capturado en Facturas`, id:null, folio:e.folio});
    }
  });
  state.proveedores.forEach(p=>{
    const total = r2(num(p.kilos)*num(p.costoKilo));
    if(num(p.abono) > total + 0.01) problemas.push({tipo:'Abono mayor a la compra', det:`Le abonaste ${money(p.abono)} a ${p.proveedor||'proveedor'} sobre una compra de ${money(total)}`, id:null, folio:'—'});
  });
  state.proveedores.forEach(c=>{
    if(num(c.kilosRecibidos) > num(c.kilos) + 0.01)
      problemas.push({tipo:'Recibiste más de lo que pediste', det:`Compra del ${dispDate(c.fecha)}: pediste ${kg(c.kilos)} y registraste ${kg(c.kilosRecibidos)} recibidos`, id:null, folio:'—'});
  });
  (state.pedidos||[]).forEach(p=>{
    const r = pedidoResumen(p);
    if(r.kEntregado > r.kRecibido + 0.01)
      problemas.push({tipo:'Entregaste más de lo que recibiste', det:`${p.folio}: entregaste ${kg(r.kEntregado)} pero el fabricante solo te surtió ${kg(r.kRecibido)}`, id:null, folio:p.folio});
    if(r.retrasado)
      problemas.push({tipo:'Pedido retrasado', det:`${p.folio}: prometido para ${dispDate(p.fechaPrometida)} y faltan ${kg(r.faltante)} por surtir`, id:null, folio:p.folio});
    if(r.saldoFab < -0.01 && p.estado!=='Abierto')
      problemas.push({tipo:'Anticipo sin aplicar', det:`${p.folio} está ${p.estado.toLowerCase()} y el fabricante se quedó con ${money(-r.saldoFab)} tuyos`, id:null, folio:p.folio});
    if(r.kSinFacturar > 0.01 && p.estado==='Abierto')
      problemas.push({tipo:'Entregado sin facturar', det:`${p.folio}: ${kg(r.kSinFacturar)} ya salieron y no se han facturado`, id:null, folio:p.folio});
    if(r.facturado > 0){
      const esperado = r.kEntregado*num(p.precioKilo)*(1+num(state.params.iva));
      if(esperado>0 && Math.abs(r.facturado-esperado)/esperado > 0.05)
        problemas.push({tipo:'Factura no cuadra con lo entregado', det:`${p.folio}: facturaste ${money(r.facturado)} y por ${kg(r.kEntregado)} a ${money(p.precioKilo)}/kg deberían ser ${money(esperado)}`, id:null, folio:p.folio});
    }
  });
  const sinPedido = state.facturas.filter(f=>!f.pedidoId && debeDinero(f)).length;
  if(sinPedido>0 && (state.pedidos||[]).length>0)
    problemas.push({tipo:'Facturas sin pedido', det:`${sinPedido} factura(s) por cobrar no están ligadas a ningún pedido, así que no entran en el cálculo de margen`, id:null, folio:'—'});

  const entradasLigadas = sum(state.caja.filter(m=>m.facturaId), m=>num(m.entrada));
  const depositado = sum(state.facturas.filter(f=>f.cobranza==='DEPOSITADO'), f=>num(f.montoDepositado));
  if(Math.abs(entradasLigadas - depositado) > 1){
    problemas.push({tipo:'Caja y cobranza no cuadran', det:`Las facturas marcadas como depositadas suman ${money(depositado)}, pero en Caja hay ${money(entradasLigadas)} de entradas ligadas a facturas`, id:null, folio:'—'});
  }
  return problemas;
}

function renderReportes(){
  const r = rangoActivo();
  const rows = facturasReporte();
  const clientes = state.catalogos.clientes;

  const facturado = sum(rows.filter(f=>f.cobranza!=='CANCELADO'), f=>num(f.montoTotal));
  const cobrado = sum(rows, f=>num(f.montoCobrado));
  const comision = sum(rows, f=> num(f.montoCobrado)>0 ? comisionDe(f) : 0);
  const neto = cobrado - comision;
  const porCobrar = sum(rows, saldoDe);

  /* --- antigüedad de saldos --- */
  const aging = {};
  rows.filter(debeDinero).forEach(f=>{
    const c = f.cliente || '(sin cliente)';
    aging[c] = aging[c] || {porvencer:0,d30:0,d60:0,d90:0,d90p:0,total:0};
    const b = bucketDe(f);
    aging[c][b] += saldoDe(f);
    aging[c].total += saldoDe(f);
  });
  const agingKeys = Object.keys(aging).sort((a,b)=>aging[b].total-aging[a].total);
  const agingTot = {porvencer:0,d30:0,d60:0,d90:0,d90p:0,total:0};
  agingKeys.forEach(c=> AGING_BUCKETS.forEach(b=>{ agingTot[b.k]+=aging[c][b.k]; }) );
  agingTot.total = agingKeys.reduce((a,c)=>a+aging[c].total,0);

  /* --- estado de cuenta por cliente --- */
  const porCliente = {};
  rows.forEach(f=>{
    const c = f.cliente || '(sin cliente)';
    porCliente[c] = porCliente[c] || {n:0, facturado:0, cobrado:0, comision:0, saldo:0, vencido:0};
    const o = porCliente[c];
    o.n++; if(f.cobranza!=='CANCELADO') o.facturado += num(f.montoTotal);
    o.cobrado += num(f.montoCobrado);
    o.comision += num(f.montoCobrado)>0 ? comisionDe(f) : 0;
    o.saldo += saldoDe(f);
    if(estadoDoc(f)==='VENCIDO') o.vencido += saldoDe(f);
  });
  const clienteKeys = Object.keys(porCliente).sort((a,b)=>porCliente[b].saldo-porCliente[a].saldo);

  /* --- resumen mensual --- */
  const meses = {};
  rows.forEach(f=>{
    const key = (f.fechaFactura||f.fechaContrarecibo||'').slice(0,7);
    if(!key) return;
    meses[key] = meses[key] || {fact:0, cob:0};
    if(f.cobranza!=='CANCELADO') meses[key].fact += num(f.montoTotal);
    meses[key].cob += num(f.montoCobrado);
  });
  const mesesKeys = Object.keys(meses).sort();
  const maxMes = Math.max(1, ...mesesKeys.map(m=>Math.max(meses[m].fact, meses[m].cob)));

  /* --- seguimiento --- */
  const seguimiento = state.facturas.filter(debeDinero).map(f=>({f, doc:estadoDoc(f), d:diasAtraso(f)}))
    .sort((a,b)=>{
      const rank = {VENCIDO:0, POR_VENCER:1, SIN_CR:2, EN_PLAZO:3};
      return (rank[a.doc]-rank[b.doc]) || ((b.d||0)-(a.d||0));
    });

  const problemas = auditoria();

  return `
  <div class="page-head">
    <h1>Reportes y seguimiento</h1>
    <p>Corte por periodo y cliente, antigüedad de lo que te deben, y una revisión automática de datos que no cuadran. Todo lo de esta pantalla se imprime tal cual.</p>
  </div>

  <div class="config-row no-print">
    <label>Desde <input class="input boxed mono" type="date" id="rep-desde" value="${r.desde||''}"></label>
    <label>Hasta <input class="input boxed mono" type="date" id="rep-hasta" value="${r.hasta||''}"></label>
    <label>Cliente
      <select class="input boxed" id="rep-cliente">
        <option value="">Todos</option>
        ${clientes.map(c=>`<option value="${escAttr(c)}" ${r.cliente===c?'selected':''}>${escHtml(c)}</option>`).join('')}
      </select>
    </label>
    <button class="btn" data-action="rango" data-rango="mes">Este mes</button>
    <button class="btn" data-action="rango" data-rango="mespasado">Mes pasado</button>
    <button class="btn" data-action="rango" data-rango="anio">Este año</button>
    <button class="btn" data-action="rango" data-rango="todo">Todo</button>
    <div class="spacer"></div>
    <button class="btn btn-primary" data-action="print" data-what="reporte">🖨 Imprimir reporte</button>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Facturado en el periodo</div><div class="kpi-value">${money(facturado)}</div><div class="kpi-sub">${rows.length} factura${rows.length===1?'':'s'}</div></div>
    <div class="kpi-card ok"><div class="kpi-label">Cobrado</div><div class="kpi-value">${money(cobrado)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Comisiones</div><div class="kpi-value">${money(comision)}</div><div class="kpi-sub">${pct(state.params.porcentajeComision)}${state.params.comisionConIVA?' + IVA':''}</div></div>
    <div class="kpi-card cash"><div class="kpi-label">Neto para ti</div><div class="kpi-value">${money(neto)}</div></div>
    <div class="kpi-card ${porCobrar>0?'warn':''}"><div class="kpi-label">Te deben del periodo</div><div class="kpi-value">${money(porCobrar)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Cobranza efectiva</div><div class="kpi-value">${facturado>0?((cobrado/facturado)*100).toFixed(1)+'%':'—'}</div><div class="kpi-sub">cobrado ÷ facturado</div></div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Antigüedad de saldos — quién te debe y desde cuándo</h3></div>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th class="sticky-col">Cliente</th>${AGING_BUCKETS.map(b=>`<th class="num">${b.label}</th>`).join('')}<th class="num">Total</th></tr></thead>
        <tbody>
          ${agingKeys.length ? agingKeys.map(c=>`<tr>
            <td class="sticky-col"><strong>${escHtml(c)}</strong></td>
            ${AGING_BUCKETS.map(b=>`<td class="num mono" style="${b.k==='d90p'&&aging[c][b.k]>0?'color:var(--bad);font-weight:700':''}">${aging[c][b.k]?money(aging[c][b.k]):'—'}</td>`).join('')}
            <td class="num mono" style="font-weight:700">${money(aging[c].total)}</td></tr>`).join('')
            : `<tr><td colspan="7"><div class="empty">Nadie te debe nada en este periodo. 🎉</div></td></tr>`}
        </tbody>
        ${agingKeys.length?`<tfoot><tr><td>Total</td>${AGING_BUCKETS.map(b=>`<td class="num">${money(agingTot[b.k])}</td>`).join('')}<td class="num">${money(agingTot.total)}</td></tr></tfoot>`:''}
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Estado de cuenta por cliente</h3><div class="spacer"></div><button class="btn no-print" data-action="print" data-what="estadocuenta">🖨 Imprimir estado de cuenta</button></div>
    <div class="table-scroll">
      <table class="data-table">

========================================================================= */
function getFactura(id){ return state.facturas.find(f=>f.id===id); }

function renderModal(){
  if(importState) return renderImportModal();
  if(!modal) return '';
  if(modal.tipo==='abono')          return modalAbono();
  if(modal.tipo==='facturar')       return modalFacturar();
  if(modal.tipo==='pedido')         return modalPedido();
  if(modal.tipo==='recepcion')      return modalRecepcion();
  if(modal.tipo==='entregaPedido')  return modalEntregaPedido();
  if(modal.tipo==='facturarPedido') return modalFacturarPedido();
  const f = getFactura(modal.id);
  if(!f){ modal = null; return ''; }
  if(modal.tipo==='ficha')       return modalFicha(f);
  if(modal.tipo==='cobro')       return modalCobro(f);
  if(modal.tipo==='deposito')    return modalDeposito(f);
  if(modal.tipo==='contrarecibo')return modalContrarecibo(f);
  return '';
}
