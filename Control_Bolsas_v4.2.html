/* --- Recepción parcial o total del fabricante --- */
function modalRecepcion(){
  const c = state.proveedores.find(r=>r.id===modal.id);
  if(!c){ modal=null; return ''; }
  const d = modal.draft;
  const yaRecibido = num(c.kilosRecibidos);
  const pendiente = r2(num(c.kilos) - yaRecibido);
  const nuevoTotal = r2(yaRecibido + num(d.kilos));
  const restante = r2(num(c.kilos) - nuevoTotal);
  return `
  <div class="modal-overlay" data-close-modal>
    <div class="modal">
      <div class="modal-head"><h3>Registrar lo que llegó del fabricante</h3>
        <button class="btn-icon" data-action="close-modal" aria-label="Cerrar">✕</button></div>

          <div class="calc-line"><span>Ya habías recibido</span><span class="mono">${yaRecibido.toLocaleString('es-MX')} kg</span></div>

          <div class="calc-line total"><span>${restante>0.01?'Quedaría pendiente':'Recepción completa'}</span><span class="mono" style="color:${restante>0.01?'var(--warn)':'var(--ok)'}">${restante>0.01?restante.toLocaleString('es-MX')+' kg':'✓'}</span></div>

/* --- Abono al proveedor, con su salida de Caja --- */
function modalAbono(){
  const p = state.proveedores.find(r=>r.id===modal.id);
  if(!p){ modal=null; return ''; }
  const d = modal.draft;
  const total = num(p.kilosRecibidos)*num(p.costoKilo);
  const pedidoTotal = num(p.kilos)*num(p.costoKilo);
  const saldoAntes = r2(total - num(p.abono));
  const saldoDespues = r2(saldoAntes - num(d.monto));
  return `
  <div class="modal-overlay" data-close-modal>
    <div class="modal">
      <div class="modal-head"><h3>Abono a ${escHtml(p.proveedor||'proveedor')}</h3>

          <div class="field"><label>Fecha</label><input class="input mono" type="date" data-draft="fecha" value="${d.fecha}"></div>
          <div class="field"><label>Forma de pago</label>

        </div>

        </label>
        <div class="calc-box" style="margin-top:14px">

          <div class="calc-line"><span>Has recibido ${num(p.kilosRecibidos).toLocaleString('es-MX')} kg — eso es lo que le debes</span><span class="mono">${money(total)}</span></div>
          <div class="calc-line"><span>Ya abonado</span><span class="mono">${money(p.abono)}</span></div>

function modalCobro(f){
  const d = modal.draft;
  const base = state.params.comisionBase==='total' ? num(f.montoTotal) : num(d.monto);

  const neto = r2(num(d.monto) - comi);
  const saldoRestante = r2(num(f.montoTotal) - num(d.monto));
  return `
  <div class="modal-overlay" data-close-modal>

function csvEscape(v){ return `"${String(v==null?'':v).replace(/"/g,'""')}"`; }
function download(nombre, contenido, mime){
  const blob = new Blob(['\uFEFF'+contenido], {type: mime||'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportCSV(key){
  let headers, lines;
  if(key==='pedidos'){
    headers = ['Folio','Cliente','O.C.','Fecha pedido','Promete','Kilos pedidos','Kilos surtidos','Faltante','Kilos entregados','Costo real','Pagado al fabricante','Saldo fabricante','Facturado','Cobrado','Por cobrar','Comisión','Margen','Fase','Estado','Notas'];
    lines = state.pedidos.map(p=>{ const r=pedidoResumen(p); return [p.folio,p.cliente,p.oc,p.fechaPedido,p.fechaPrometida,
      r.kSolicitado,r.kRecibido,r.faltante,r.kEntregado,r.costoReal,r.pagadoFab,r.saldoFab,r.facturado,r.cobrado,r.porCobrar,r.comision,r.margen,FASE[r.fase].label,p.estado,p.notas]; });
  } else if(key==='facturas'){
    headers = ['Folio','Cliente','RFC receptor','O.C.','Fecha factura','Monto total','Contrarecibo','Núm. contrarecibo','Fecha contrarecibo','Vence','Días atraso','Estado cobranza','Situación','Cobrado','Comisión','Neto','Te deben','Depositado','Fecha depósito','Notas'];
    headers.splice(2,0,'Pedido');
    lines = facturasFiltradas().map(f=>[
      f.folio, f.cliente, (f.pedidoId && getPedido(f.pedidoId) ? getPedido(f.pedidoId).folio : ''), f.receptor, f.oc, f.fechaFactura, r2(f.montoTotal), f.contrarecibo, f.numContrarecibo,
      f.fechaContrarecibo, f.fechaVencimiento, diasAtraso(f)===null?'':diasAtraso(f),
      COBRANZA[f.cobranza].label, DOC[estadoDoc(f)].label,
      r2(f.montoCobrado), r2(comisionDe(f)), r2(netoDe(f)), r2(saldoDe(f)), r2(f.montoDepositado), f.fechaDeposito, f.notas
    ]);
  } else {
    const cfg = TABLES[key];
    headers = cfg.columns.map(c=>c.label);
    const rows = [...state[key]].sort(cfg.sort);
    let running = 0;
    lines = rows.map(r=> cfg.columns.map(c=>{
      if(key==='caja' && c.key==='saldoAcumulado'){ running += num(r.entrada)-num(r.salida); return r2(running); }
      if(c.calc) return r2(c.calc(r));
      return r[c.key];
    }));
  }
  const csv = [headers.map(csvEscape).join(','), ...lines.map(l=>l.map(csvEscape).join(','))].join('\n');
  download(`${key}-${todayISO()}.csv`, csv);
  toast('CSV descargado');
}

function quitarMovimientoCaja(f){
  if(f.cajaMovIds && f.cajaMovIds.length){
    state.caja = state.caja.filter(m=> !f.cajaMovIds.includes(m.id));
  }
  f.cajaMovIds = [];
}
function crearMovimientoCaja(f, monto, fecha, tipo){
  const ref = `${f.folio||''}${f.numContrarecibo?` / CR ${f.numContrarecibo}`:''}`.trim() || 'sin folio';
  const mov = { id:uid(), seq:seqCounter++, fecha: fecha||todayISO(),
    concepto:`Cobro factura ${ref}`, entrada:r2(monto), salida:0,
    tipo:tipo||'Transferencia', facturaId:f.id };
  state.caja.push(mov);
  f.cajaMovIds.push(mov.id);
  // Si contabilidad te cobra la comisión por separado, el banco recibe el importe
  // completo y la comisión sale como un movimiento propio: así se ve el gasto.
  if(state.params.comisionModo === 'aparte'){
    const c = comisionDe(f);
    if(c > 0){
      const salida = { id:uid(), seq:seqCounter++, fecha: fecha||todayISO(),
        concepto:`Comisión contabilidad — factura ${ref}`, entrada:0, salida:r2(c),
        tipo:'Transferencia', facturaId:f.id };
      state.caja.push(salida);
      f.cajaMovIds.push(salida.id);
    }
  }
  return mov;
}
function crearSalidaCajaProveedor(p, monto, fecha, tipo){
  const mov = { id:uid(), seq:seqCounter++, fecha: fecha||todayISO(),
    concepto:`Abono a ${p.proveedor||'proveedor'}${p.concepto?` — ${p.concepto}`:''}`,
    entrada:0, salida:r2(monto), tipo:tipo||'Transferencia', facturaId:null, proveedorId:p.id };
  state.caja.push(mov);
  return mov;
}
function aplicarCobranza(id, nuevo, opts){
  opts = opts || {};
  const f = getFactura(id); if(!f) return;
  const anterior = f.cobranza;
  if(anterior === nuevo && !opts.forzar) return;
  snapshot();
  if(nuevo==='PENDIENTE'){
    f.cobranza='PENDIENTE'; f.montoCobrado=0; f.fechaCobro=''; f.montoDepositado=0; f.fechaDeposito='';
    if(!f.comisionManual) f.comision=0;
    quitarMovimientoCaja(f);
    logFactura(f,'Regresada a “por cobrar”.');
    toast('Vuelve a contar en lo que te deben', {undo:true});
  }
  else if(nuevo==='PARCIAL'){
    f.cobranza='PARCIAL';
    if(num(f.montoCobrado)===0) f.montoCobrado = 0;
    if(!f.fechaCobro) f.fechaCobro = todayISO();
    sincronizarComision(f);
    logFactura(f,`Marcada como cobro parcial (${money(f.montoCobrado)}).`);
    toast('Marcada como cobro parcial — captura el monto en la ficha', {undo:true});
  }
  else if(nuevo==='COBRADO'){
    const monto = opts.monto !== undefined ? r2(opts.monto) : r2(f.montoTotal);
    f.montoCobrado = monto;
    f.fechaCobro = opts.fecha || f.fechaCobro || todayISO();
    sincronizarComision(f);
    f.cobranza = (monto < num(f.montoTotal)-0.01) ? 'PARCIAL' : 'COBRADO';
    logFactura(f, `Cobro registrado por ${money(monto)} · comisión ${money(comisionDe(f))} · neto ${money(netoDe(f))}.`);
    toast(`Cobrado ${money(monto)} · comisión ${money(comisionDe(f))} · neto ${money(netoDe(f))}`, {undo:true, tone:'ok'});
  }
  else if(nuevo==='DEPOSITADO'){
    if(num(f.montoCobrado)===0){ f.montoCobrado = r2(f.montoTotal); f.fechaCobro = f.fechaCobro || todayISO(); sincronizarComision(f); }
    const neto = opts.monto !== undefined ? r2(opts.monto) : depositoEsperado(f);
    f.montoDepositado = neto;
    f.fechaDeposito = opts.fecha || todayISO();
    f.cobranza = 'DEPOSITADO';
    const aCaja = opts.aCaja !== undefined ? opts.aCaja : true;
    quitarMovimientoCaja(f);
    if(aCaja) crearMovimientoCaja(f, neto, f.fechaDeposito, opts.tipo);
    const extra = (aCaja && state.params.comisionModo==='aparte' && comisionDe(f)>0) ? ' y la comisión como salida' : '';
    logFactura(f, `Depósito registrado por ${money(neto)}${aCaja?' y anotado en Caja'+extra:''}.`);
    toast(`Depositado ${money(neto)}${aCaja?' · movimiento'+(extra?'s':'')+' creado'+(extra?'s':'')+' en Caja':''}`, {undo:true, tone:'ok'});
  }
  else if(nuevo==='CANCELADO'){
    f.cobranza='CANCELADO';
    quitarMovimientoCaja(f);
    logFactura(f,'Factura cancelada — deja de contar en todos los totales.');
    toast('Factura cancelada', {undo:true});
  }
  scheduleSave(); render();
}

/* =========================================================================
   DISPATCH DE RENDER
========================================================================= */
function render(){
  renderNav();
  renderRibbon();
  const c = document.getElementById('content');
  const tab = state.activeTab;
  if(tab==='dashboard') c.innerHTML = renderDashboard();
  else if(tab==='pedidos') c.innerHTML = renderPedidos();
  else if(tab==='facturas') c.innerHTML = renderFacturas();
  else if(tab==='reportes') c.innerHTML = renderReportes();
  else c.innerHTML = renderGenericModule(tab);
  document.getElementById('modal-root').innerHTML = renderModal();
  if(pendingFocusId){
    const el = document.getElementById(pendingFocusId);
    if(el){ el.focus(); try{ el.selectionStart = el.selectionEnd = el.value.length; }catch(_e){} }
    pendingFocusId = null;
  }
}
function irA(tab, filtro){
  state.activeTab = tab;
  if(filtro) state.facturaFilter = filtro;
  document.body.classList.remove('nav-open');
  window.scrollTo({top:0, behavior:'instant'});
  scheduleSave(); render();
}

/* =========================================================================
   TEMA
========================================================================= */
function aplicarTema(){
  let t = (state && state.params && state.params.tema) || 'auto';
  if(t==='auto') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
}
function alternarTema(){
  const actual = document.documentElement.dataset.theme;
  state.params.tema = actual==='dark' ? 'light' : 'dark';
  aplicarTema(); scheduleSave(); renderNav();
}

/* =========================================================================
   FICHA — leer y guardar
========================================================================= */
const CAMPOS_NUM = ['montoTotal','montoCobrado','comision','montoDepositado'];
function leerFicha(f){
  document.querySelectorAll('#modal-root [data-fx]').forEach(el=>{
    const campo = el.dataset.fx;
    if(campo==='comision' && !f.comisionManual) return;
    if(campo==='pedidoId'){ f.pedidoId = el.value || null; return; }
    f[campo] = CAMPOS_NUM.includes(campo) ? num(el.value) : el.value;
  });
  if(f.numContrarecibo && f.contrarecibo!=='SI') f.contrarecibo='SI';
  sincronizarComision(f);
  normalizeFactura(f);
}

const CAMPOS_NUM_PEDIDO = ['kilos','precioKilo','costoKilo'];
function leerPedido(p){
  document.querySelectorAll('#modal-root [data-px]').forEach(el=>{
    const c = el.dataset.px;
    p[c] = CAMPOS_NUM_PEDIDO.includes(c) ? num(el.value) : el.value;
  });
  normalizePedido(p);
}

/* =========================================================================
   EVENTOS
========================================================================= */
document.addEventListener('wheel', (e)=>{
  const el = document.activeElement;
  if(el && el.tagName==='INPUT' && el.type==='number' && el===e.target) el.blur();
}, {passive:true});

document.getElementById('btn-nav-toggle').addEventListener('click', ()=> document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click', ()=> document.body.classList.remove('nav-open'));

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(importState){ importState=null; render(); }
    else if(modal){ modal=null; render(); }
    else document.body.classList.remove('nav-open');
  }
  if((e.ctrlKey||e.metaKey) && e.key==='p' && state.activeTab==='facturas'){
    e.preventDefault(); printFacturas();
  }
});

document.addEventListener('click', (e)=>{

  if(nav){ irA(nav.dataset.tab); return; }

  const goto = t.closest('[data-goto]');

  const chip = t.closest('[data-action="filter-facturas"]');

  const th = t.closest('th[data-sort]');

  const rango = t.closest('[data-action="rango"]');

    const hoy = new Date(); const y = hoy.getFullYear(); const m = hoy.getMonth();
    const iso = (d)=> new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    const r = state.reporteRango || {desde:'',hasta:'',cliente:''};
    if(rango.dataset.rango==='mes'){ r.desde = iso(new Date(y,m,1)); r.hasta = iso(new Date(y,m+1,0)); }
    if(rango.dataset.rango==='mespasado'){ r.desde = iso(new Date(y,m-1,1)); r.hasta = iso(new Date(y,m,0)); }
    if(rango.dataset.rango==='anio'){ r.desde = iso(new Date(y,0,1)); r.hasta = iso(new Date(y,11,31)); }
    if(rango.dataset.rango==='todo'){ r.desde=''; r.hasta=''; }
    state.reporteRango = r; scheduleSave(); render(); return;

    else if(what==='pedidos') printPedidos();
    else if(what==='reporte') printReporte();
    else if(what==='estadocuenta') printEstadoCuenta();
    else printGenerico(what);
    return;
  }
  const prF = t.closest('[data-action="print-factura"]');
  if(prF){ printFacturaUna(prF.dataset.id); return; }

  const ficha = t.closest('[data-action="ficha"]');

  const tg = t.closest('[data-action="toggle-comision"]');
  if(tg){
    const f = getFactura(tg.dataset.id);
    if(f){ leerFicha(f); f.comisionManual = !f.comisionManual; if(!f.comisionManual) sincronizarComision(f); scheduleSave(); render(); }
    return;
  }

  const saveF = t.closest('[data-action="save-ficha"]');
  if(saveF){
    const f = getFactura(saveF.dataset.id);
    if(f){ snapshot(); leerFicha(f); logFactura(f,'Ficha editada a mano.'); scheduleSave(); modal=null; render(); toast('Cambios guardados', {tone:'ok', undo:true}); }

  const closeM = t.closest('[data-action="close-modal"]');

  const cCobro = t.closest('[data-action="confirm-cobro"]');

  }

    const d = modal.draft;
    if(num(d.monto)<=0){ toast('Escribe un monto mayor a cero', {tone:'bad'}); return; }

  }

  const marcarF = t.closest('[data-action="marcar-facturado"]');

  const qa = t.closest('[data-action="quick-abono"]');

    return;

  const factEnt = t.closest('[data-action="facturar-entrega"]');
  if(factEnt){

      modal = {tipo:'facturar', id:e.id, draft:{
        folio: e.folio||'', fecha: todayISO(), cliente: e.cliente||'',
        monto: r2(num(e.kilos)*num(e.precioKilo)*(1+num(state.params.iva))), oc:''
      }};
      render();
    }
    return;
  }

  const confFact = t.closest('[data-action="confirm-facturar"]');
  if(confFact){

    const d = modal.draft;
    if(!e) return;

    const nueva = normalizeFactura({id:uid(), seq:seqCounter++, folio:d.folio, cliente:d.cliente,

        fechaPrometida:p.fechaPrometida||'', fechaRecepcion:'',

      logPedido(p, `Orden al fabricante por ${kg(compra.kilos)} a ${money(compra.costoKilo)}/kg.`);

      toast(`Orden al fabricante creada por ${kg(compra.kilos)}`, {undo:true, tone:'ok'});

  }

  const recep = t.closest('[data-action="recepcion"]');
  if(recep){
    const c = state.proveedores.find(r=>r.id===recep.dataset.id);

      const pend = r2(Math.max(num(c.kilos)-num(c.kilosRecibidos),0));
      modal = {tipo:'recepcion', id:c.id, volver, draft:{kilos:pend, fecha:todayISO()}};

    const r = pedidoResumen(p);

      receptor:(state.facturas[0]||{}).receptor||'', oc:d.oc||p.oc, fechaFactura:d.fecha,
      montoTotal:num(d.monto), contrarecibo:'NO', pedidoId:p.id,
      notas:`Factura del pedido ${p.folio} — ${r.kSinFacturar.toLocaleString('es-MX')} kg entregados.`});

    f.contrarecibo = 'SI';
    f.numContrarecibo = d.num.trim().toUpperCase();

    modal = null; scheduleSave(); render();
    toast(`Contrarecibo ${f.numContrarecibo} registrado · vence ${dispDate(f.fechaVencimiento)}`, {undo:true, tone:'ok'});

  const add = t.closest('[data-action="add-row"]');
  if(add){
    snapshot();
    const tb = add.dataset.table;
    if(tb==='facturas'){

        receptor:(state.facturas[0]||{}).receptor||'', oc:'', fechaFactura:todayISO(), montoTotal:0, contrarecibo:'NO'});
      logFactura(nueva,'Factura creada.');
      state.facturas.unshift(nueva);
      state.facturaFilter='TODAS';
      scheduleSave(); render();
      modal = {tipo:'ficha', id:nueva.id}; render();
    } else {
      state[tb].push(TABLES[tb].newRow());

  const del = t.closest('[data-action="delete"]');
  if(del){
    const {table, id} = del.dataset;
    const row = state[table].find(r=>r.id===id);
    const etiqueta = table==='facturas' ? `la factura ${(row&&row.folio)||''}`
      : (table==='pedidos' ? `el pedido ${(row&&row.folio)||''} (las compras, entregas y facturas se quedan, solo se desligan)` : 'esta fila');
    if(confirm(`¿Eliminar ${etiqueta}? Puedes deshacerlo desde el aviso que aparece abajo.`)){
      snapshot();
      if(table==='facturas' && row) quitarMovimientoCaja(row);
      if(table==='pedidos'){
        state.proveedores.forEach(r=>{ if(r.pedidoId===id) r.pedidoId=null; });
        state.entregas.forEach(r=>{ if(r.pedidoId===id) r.pedidoId=null; });
        state.facturas.forEach(r=>{ if(r.pedidoId===id) r.pedidoId=null; });
      }
      state[table] = state[table].filter(r=>r.id!==id);
      modal = null;
      scheduleSave(); render();
      toast('Registro eliminado', {undo:true, tone:'bad'});
    }
    return;
  }

  const csv = t.closest('[data-action="export-csv"]');
  if(csv){ exportCSV(csv.dataset.table); return; }

  /* --- importador --- */
  const openImp = t.closest('[data-action="open-import"]');
  if(openImp){ importState = {rows:null, error:''}; render(); return; }
  const closeImp = t.closest('[data-action="close-import"]');
  if(closeImp){ importState=null; render(); return; }
  const ovlImp = t.closest('[data-close-import]');
  if(ovlImp && t===ovlImp){ importState=null; render(); return; }
  const backImp = t.closest('[data-action="back-import"]');
  if(backImp){ importState={rows:null, error:''}; render(); return; }
  const anaImp = t.closest('[data-action="analyze-import"]');
  if(anaImp){
    const ta = document.getElementById('import-textarea');
    const parsed = parseContrarecibosPaste(ta ? ta.value : '');
    importState = parsed.length
      ? {rows: buildImportPreview(parsed), error:''}
      : {rows:null, error:'No se detectaron contrarecibos en ese texto. Copia la tabla completa del portal, con encabezados y filas, e inténtalo otra vez.'};
    render(); return;
  }
  const togImp = t.closest('[data-action="toggle-import-row"]');
  if(togImp){
    const i = parseInt(togImp.dataset.idx,10);
    if(importState && importState.rows && importState.rows[i]) importState.rows[i].included = !importState.rows[i].included;
    render(); return;
  }
  const confImp = t.closest('[data-action="confirm-import"]');
  if(confImp){
    snapshot();
    const rows = (importState && importState.rows) || [];
    let nuevos=0, act=0, om=0;
    rows.forEach(r=>{ if(!r.included){om++; return;} if(r.targetId) act++; else nuevos++; applyImportRow(r); });
    importState = null; scheduleSave(); render();
    toast(`Importación lista · ${nuevos} nuevas, ${act} vinculadas, ${om} omitidas`, {undo:true, tone:'ok', ms:9000});
    return;
  }
});

/* --- cambios en selects --- */
document.addEventListener('change', (e)=>{
  const el = e.target;

  const cob = el.closest('[data-action="set-cobranza"]');
  if(cob){
    // "Cobro parcial" necesita que digas cuánto entró, así que abre el registro de cobro
    if(el.value === 'PARCIAL'){ abrirCobro(cob.dataset.id); return; }
    aplicarCobranza(cob.dataset.id, el.value);
    return;
  }

  const menu = el.closest('[data-action="menu"]');
  if(menu){
    const id = menu.dataset.id, v = el.value;
    el.value = '';
    if(v==='ficha') { modal={tipo:'ficha', id}; render(); }
    else if(v==='contrarecibo') abrirContrarecibo(id);
    else if(v==='cobro') abrirCobro(id);
    else if(v==='deposito') abrirDeposito(id);
    else if(v==='revertir') aplicarCobranza(id,'PENDIENTE',{forzar:true});
    else if(v==='duplicar') duplicarFactura(id);
    else if(v==='print') printFacturaUna(id);
    else if(v==='delete'){
      const f = getFactura(id);
      if(f && confirm(`¿Eliminar la factura ${f.folio||''}? Puedes deshacerlo desde el aviso que aparece abajo.`)){
        snapshot(); quitarMovimientoCaja(f);
        state.facturas = state.facturas.filter(x=>x.id!==id);
        scheduleSave(); render(); toast('Factura eliminada', {undo:true, tone:'bad'});
      }
    }
    return;
  }

  if(el.dataset && el.dataset.draft && modal){
    modal.draft[el.dataset.draft] = (el.type==='checkbox') ? el.checked : el.value;
    render(); return;
  }

  if(el.id==='rep-desde'){ state.reporteRango = {...rangoActivo(), desde:el.value}; scheduleSave(); render(); return; }
  if(el.id==='rep-hasta'){ state.reporteRango = {...rangoActivo(), hasta:el.value}; scheduleSave(); render(); return; }
  if(el.id==='rep-cliente'){ state.reporteRango = {...rangoActivo(), cliente:el.value}; scheduleSave(); render(); return; }
  if(el.id==='param-comisionBase'){ state.params.comisionBase = el.value; scheduleSave(); render(); return; }
  if(el.id==='param-comisionIVA'){ state.params.comisionConIVA = el.checked; scheduleSave(); render(); return; }
  if(el.id==='param-comisionModo'){ state.params.comisionModo = el.value; scheduleSave(); render(); return; }
});

/* --- escritura en celdas y campos --- */
document.addEventListener('input',(e)=>{
  const el = e.target;

  if(el.dataset && el.dataset.draft && modal){
    modal.draft[el.dataset.draft] = (el.type==='checkbox') ? el.checked : el.value;
    return; // el recálculo se muestra al salir del campo
  }

  if(el.id==='factura-search'){
    state.facturaSearch = el.value;
    pendingFocusId = 'factura-search';
    clearTimeout(renderDebounceTimer);
    renderDebounceTimer = setTimeout(()=>{ scheduleSave(); render(); }, 280);
    return;
  }

  const PARAMS = {'param-refCosto':'refCosto','param-refPrecio':'refPrecio','param-iva':'iva',
                  'param-comision':'porcentajeComision','param-diasAviso':'diasAvisoPrevio',
                  'param-plazoCR':'diasPlazoContrarecibo'};
  if(PARAMS[el.id]){
    state.params[PARAMS[el.id]] = num(el.value);
    pendingFocusId = el.id;
    scheduleSave();
    clearTimeout(renderDebounceTimer);
    renderDebounceTimer = setTimeout(render, 500);
    return;
  }

  if(el.id==='config-proveedor-nombre'){
    const nuevo = el.value, anterior = state.catalogos.proveedores[0] || '';
    state.catalogos.proveedores[0] = nuevo;
    state.proveedores.forEach(r=>{ if(r.proveedor===anterior) r.proveedor = nuevo; });
    pendingFocusId = 'config-proveedor-nombre';
    scheduleSave();
    clearTimeout(renderDebounceTimer);
    renderDebounceTimer = setTimeout(render, 500);
    return;
  }

  if(el.dataset && el.dataset.table && el.dataset.field){
    const {table, id, field} = el.dataset;
    const row = state[table].find(r=>r.id===id);
    if(!row) return;
    if(el.dataset.catalog==='true' && el.value==='__add_new__'){
      const catKey = el.dataset.catalogKey;
      const nuevo = prompt('Nombre del nuevo valor para el catálogo:');
      if(nuevo && nuevo.trim()){
        if(!state.catalogos[catKey].includes(nuevo.trim())) state.catalogos[catKey].push(nuevo.trim());
        row[field] = nuevo.trim();
      }
      scheduleSave(); render(); return;
    }
    row[field] = (field==='pedidoId') ? (el.value || null) : ((el.type==='number') ? num(el.value) : el.value);
    if(table==='facturas'){
      if(field==='numContrarecibo' && row[field]) row.contrarecibo = 'SI';
      if(field==='fechaContrarecibo' && row[field] && !row.fechaVencimiento){
        row.fechaVencimiento = addDays(row[field], num(state.params.diasPlazoContrarecibo)||30);
        row.contrarecibo = 'SI';
      }
      if(field==='montoTotal' || field==='montoCobrado') sincronizarComision(row);
    }
    scheduleSave();
    if(el.tagName==='SELECT'){ render(); }
    else { lastFocusedField = {table, id, field}; scheduleRenderDebounced(); }
  }
});

function abrirContrarecibo(id){
  const f = getFactura(id); if(!f) return;
  modal = {tipo:'contrarecibo', id, draft:{
    num: f.numContrarecibo || '',
    fecha: f.fechaContrarecibo || todayISO(),
    plazo: num(state.params.diasPlazoContrarecibo) || 30
  }};
  render();
}
function abrirCobro(id){
  const f = getFactura(id); if(!f) return;
  const pend = r2(Math.max(num(f.montoTotal)-num(f.montoCobrado),0)) || r2(f.montoTotal);
  modal = {tipo:'cobro', id, draft:{monto: pend, fecha: todayISO()}};
  render();
}
function abrirDeposito(id){
  const f = getFactura(id); if(!f) return;
  if(num(f.montoCobrado)===0){
    modal = null;
    toast('Primero registra el cobro; después el depósito', {tone:'bad'});
    abrirCobro(id); return;
  }
  modal = {tipo:'deposito', id, draft:{monto: depositoEsperado(f), fecha: todayISO(), tipo:'Transferencia', aCaja:true}};
  render();
}
function duplicarFactura(id){
  const f = getFactura(id); if(!f) return;
  snapshot();
  const copia = normalizeFactura({...JSON.parse(JSON.stringify(f)), id:uid(), seq:seqCounter++,
    folio:'', numContrarecibo:'', contrarecibo:'NO', fechaContrarecibo:'', fechaVencimiento:'',
    cobranza:'PENDIENTE', montoCobrado:0, comision:0, montoDepositado:0, fechaCobro:'', fechaDeposito:'',
    cajaMovIds:[], historial:[], fechaFactura:todayISO()});
  logFactura(copia, `Duplicada a partir de la factura ${f.folio||'(sin folio)'}.`);
  state.facturas.unshift(copia);
  scheduleSave(); render();
  modal = {tipo:'ficha', id:copia.id}; render();
  toast('Factura duplicada — ajusta folio y monto', {undo:true});
}

/* --- respaldo / restaurar / reiniciar --- */
document.getElementById('btn-export').addEventListener('click', ()=>{
  download(`respaldo-control-bolsas-${todayISO()}.json`, JSON.stringify(state,null,2), 'application/json');
  toast('Respaldo descargado', {tone:'ok'});
});
document.getElementById('btn-import').addEventListener('click', ()=> document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.facturas || !data.caja) throw new Error('formato');
      state = prepararEstado(data);
      scheduleSave(); aplicarTema(); render();
      toast('Respaldo restaurado', {tone:'ok'});
    }catch(err){ toast('Ese archivo no es un respaldo válido de este sistema', {tone:'bad', ms:6000}); }
  };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('btn-reset').addEventListener('click', ()=>{
  if(confirm('Esto reemplaza TODOS tus datos actuales por los datos originales migrados del Excel. ¿Continuar?')){
    state = prepararEstado(seedData());
    scheduleSave(); render();
    toast('Datos originales cargados');
  }
});

/* =========================================================================
   ARRANQUE
========================================================================= */
function prepararEstado(data){
  const base = seedData();
  data.params = Object.assign({}, base.params, data.params||{});
  data.catalogos = Object.assign({}, base.catalogos, data.catalogos||{});
  ['pedidos','proveedores','entregas','caja','facturas'].forEach(k=>{ if(!Array.isArray(data[k])) data[k] = []; });
  data.pedidos.forEach(normalizePedido);
  // Compras anteriores a los pedidos: lo comprado se da por recibido para no
  // alterar ningún saldo que ya tenías cuadrado.
  data.proveedores.forEach(r=>{
    if(r.kilosRecibidos === undefined) r.kilosRecibidos = num(r.kilos);
    if(r.fechaPrometida === undefined) r.fechaPrometida = '';
    if(r.fechaRecepcion === undefined) r.fechaRecepcion = (num(r.kilosRecibidos)>0 ? (r.fecha||'') : '');
    if(r.pedidoId === undefined) r.pedidoId = null;
  });
  data.entregas.forEach(e=>{ if(e.pedidoId === undefined) e.pedidoId = null; });
  data.facturas.forEach(f=>{ if(f.pedidoId === undefined) f.pedidoId = null; });
  data.facturas.forEach(normalizeFactura);
  data.pedidoFilter = data.pedidoFilter || 'ABIERTOS';
  data.caja.forEach(m=>{ if(m.facturaId===undefined) m.facturaId = null; if(m.proveedorId===undefined) m.proveedorId = null; });
  data.entregas.forEach(e=>{ if(e.facturaId===undefined) e.facturaId = null; });
  data.activeTab = data.activeTab || 'dashboard';
  data.facturaFilter = data.facturaFilter || 'TODAS';
  data.entregaFilter = data.entregaFilter || 'TODAS';
  data.facturaSearch = data.facturaSearch || '';
  data.facturaSort = data.facturaSort || {key:'fechaFactura', dir:-1};
  data.reporteRango = data.reporteRango || {desde:'', hasta:'', cliente:''};
  data.version = 4;
  seqCounter = Math.max(1000, ...['pedidos','proveedores','entregas','caja','facturas']
    .flatMap(k=>(data[k]||[]).map(r=>num(r.seq)))) + 1;
  return data;
}

(async function init(){
  let cargado = null;
  try{
    const raw = await DB.get(STORAGE_KEY);
    if(raw) cargado = JSON.parse(raw);
  }catch(e){}
  if(!cargado){
    for(const k of LEGACY_KEYS){
      try{
        const raw = await DB.get(k);
        if(raw){ cargado = JSON.parse(raw); break; }
      }catch(e){}
    }
    if(cargado) setTimeout(()=> toast('Se importaron tus datos de la versión anterior', {ms:6000}), 900);
  }
  state = prepararEstado(cargado || seedData());
  aplicarTema();
  if(!cargado) scheduleSave();
  render();
})();
</script>
